<!DOCTYPE html>
<!--
  АРХИВ ЗАМЕТОК — краткое описание сайта

  Файлы:  index.html (страница и скрипт), style.css (оформление), letters.enc (зашифрованные письма),
          fonts/font.woff2 (шрифт), pics/pic.jpg (аватарка), sounds/click.mp3 (звук нажатия).

  Как устроено:
  • Вход по коду доступа. Письма лежат в letters.enc и расшифровываются прямо в браузере
    (PBKDF2 + AES-GCM), в коде страницы их нет, после перезагрузки они пропадают из памяти.
  • Запоминание входа: на экране входа под окном есть квадратик «запомнить меня на этом устройстве».
    Без галочки ничего не сохраняется, и после перезагрузки код спросят снова. С галочкой в
    localStorage (ключ "lk") кладётся ключ расшифровки, а не сам код и не письма: код тогда не
    спрашивают, пока не нажата кнопка «выйти» (справа внизу, на телефоне тоже справа внизу; она стирает ключ). Сменили код или пересобрали letters.enc — ключ перестанет подходить,
    и сайт снова попросит код.
  • «что за проект?» — раскрывающееся окно с описанием: текст печатается, в нём есть оформление
    и ссылка на открытый исходный код. Закрывается кнопкой, Esc, свайпом вниз (если текст пролистан до верха)
    или, на телефоне, нажатием в любом месте экрана вне окна с текстом.
  • Избранное: в открытой заметке справа от названия стоит значок-закладка (лента с V-вырезом снизу, нарисована на более мелкой пиксельной сетке 19×19, чтобы не казаться грубее остальных кнопок); по нажатию он заливается жёлтым, подпрыгивает
    и разлетается пикселями. В списке избранные заметки помечены маленьким жёлтым значком у верхнего правого угла названия.
    Избранное хранится только на устройстве (с галочкой «запомнить меня» — в localStorage, ключ "fav", без неё — в sessionStorage)
    и стирается кнопкой «выйти».
  • Письма: <v>выделение</v>, <u>подчёркивание</u>, <i>курсив</i>, <b>жирный</b>
    и ссылки <a href="https://...">текст</a> (только http/https).
  • Лицензии: кнопка «L» слева снизу (на одной линии с кнопкой выхода). По нажатию вправо, на одном уровне,
    выезжают две ссылки: ibuzy projects — MIT License (github.com/ibuzy/secret) и шрифт WebPlus IBM MDA — CC BY-SA 4.0
    (int10h.org/oldschool-pc-fonts). Закрываются повторным нажатием, нажатием в другом месте или Esc.
  • Звёзды на фоне: почти неподвижные, загораются прямо на экране (жёлтые / оранжевые / красные оттенки, разного размера),
    со светящимся ореолом и лучами. Живут 10–30 с, перед концом уменьшаются, краснеют и взрываются (вспышка, кольцо, осколки).
    Одновременно не больше 3 (на телефоне 2), появляются далеко друг от друга, от планет и созвездий.
  • Чёрные дыры на фоне: пять настоящих (Стрелец A*, M87*, Лебедь X-1, TON 618, Gaia BH1) с вращающимся аккреционным диском,
    ореолом, дугой линзирования и (у M87* и Лебедя X-1) джетами; под каждой подпись. Одновременно не больше одной.
  • Фон: летающие пиксели, настоящие созвездия (50 штук), которые линиями прорисовываются на экране,
    и маленькие пиксельные планеты Солнечной системы (все восемь): появляются в случайное время и в
    случайном месте, не близко к другим планетам и созвездиям.
  • Кнопки справа сверху (стопкой, на телефоне компактнее): тема, анимации и звук; после входа ещё
    «выйти» (справа внизу). Тема, анимации, звук и «пустота» спрятаны в шестерёнку справа сверху: на компьютере раскрываются вниз столбиком, на телефоне — влево и по диагонали.
    По умолчанию тема тёмная, звук выключен; выбор запоминается в браузере.
  • ЗВУК: при нажатии на любую кнопку проигрывается sounds/click.mp3 (mp3 понимают все браузеры,
    включая iPhone). Играет через Web Audio (файл грузится один раз). Включается кнопкой-динамиком под кнопкой анимаций; пока она выключена — тишина.
    Чтобы заменить звук, положите свой файл в папку sounds под тем же именем.

  Данные созвездий (положение звёзд и линии фигур) взяты из проекта d3-celestial (https://github.com/ofrohn/d3-celestial),

  <script>
    /* применяем сохранённые тему и режим анимаций до отрисовки, чтобы не было мигания */
    const d = document.documentElement;
    d.classList.add("booting");
    d.dataset.theme = "dark";                    // по умолчанию тёмная тема; «light» только если выбрана вручную
    try {
      const m = localStorage.getItem("motion");
      if (localStorage.getItem("theme") === "light") delete d.dataset.theme;
      if (localStorage.getItem("sound") === "on") d.dataset.sound = "on";   // звук по умолчанию выключен
      if (m === "off" || (!m && matchMedia("(prefers-reduced-motion: reduce)").matches)) d.dataset.motion = "off";
    } catch (e) {}
  </script>
  <!-- экран загрузки: чёрный, с индикатором по центру; стили инлайном, чтобы он был виден раньше style.css -->
  <style>
    #boot { position: fixed; inset: 0; z-index: 99999; display: flex; align-items: center; justify-content: center; background: #000; color: #f2f2f2; transition: opacity .5s ease; }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot i { display: block; width: 32px; height: 4px; background: repeating-linear-gradient(90deg, currentColor 0 4px, transparent 4px 8px); animation: boot-load 1.2s ease-in-out infinite; }
    @keyframes boot-load { 0% { clip-path: inset(0 100% 0 0); } 25% { clip-path: inset(0 75% 0 0); } 50% { clip-path: inset(0 50% 0 0); } 75% { clip-path: inset(0 25% 0 0); } 100% { clip-path: inset(0 0 0 0); } }
    /* пока идёт загрузка, анимации появления стоят на первом кадре и стартуют, когда экран загрузки уходит */
    html.booting *, html.booting ::before, html.booting ::after { animation-play-state: paused !important; }
    html.booting #boot i { animation-play-state: running !important; }
    html.booting { overflow: hidden; }
  </style>
  <noscript><style>#boot { display: none; }</style></noscript>
  <link rel="stylesheet" href="style.css?v=12">
</head>

  <script>
    /* Тексты писем лежат в зашифрованном файле letters.enc (см. private/encrypt.mjs).
       В этом коде их нет: они появляются в памяти только после ввода верного кода
       и пропадают при перезагрузке страницы. */
    (() => {
      const $ = id => document.getElementById(id);
      const root = document.documentElement;
      const isOff = () => root.dataset.motion === "off";
      const list = $("letters"), home = $("home"), viewer = $("viewer"), backBtn = $("back");
      const titleEl = $("letter-title"), dateEl = $("letter-date"), bodyEl = $("letter-body");
      let letters = [];
      let lastTrigger = null;

      /* ---------- Вход по коду доступа ---------- */
      const AAD = "letters-v1";                      // должно совпадать с private/encrypt.mjs
      const gate = $("gate"), pass = $("gate-pass"), gateText = $("gate-text"), loader = $("gate-loader");
      const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
      let vault = null, busy = false;

      /* глаз в поле кода: показать / скрыть код. Нигде не сохраняется, после перезагрузки код снова скрыт */
      const eye = $("gate-eye");
      const setEye = show => {
        pass.type = show ? "text" : "password";
        eye.classList.toggle("on", show);
        eye.setAttribute("aria-pressed", show);
        eye.setAttribute("aria-label", show ? "Скрыть код" : "Показать код");
      };
      eye.addEventListener("mousedown", e => e.preventDefault());      // фокус остаётся в поле, клавиатура на телефоне не закрывается
      eye.addEventListener("click", () => { setEye(pass.type === "password"); pass.focus({ preventScroll: true }); });

      const loadVault = () => vault || (vault = fetch("letters.enc", { cache: "no-store" })
        .then(r => { if (!r.ok) throw new Error("http"); return r.json(); })
        .catch(e => { vault = null; throw e; }));

      /* код -> ключ (32 байта); именно ключ, а не сам код, запоминается на устройстве до кнопки «выйти» */
      async function deriveRaw(password, v) {
        const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password.normalize("NFKC")), "PBKDF2", false, ["deriveBits"]);
        const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(v.salt), iterations: v.iter }, base, 256);
        return new Uint8Array(bits);
      }

      async function openVault(raw, v) {
        const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
        const buf = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(v.iv), additionalData: new TextEncoder().encode(AAD) }, key, b64(v.data));
        return JSON.parse(new TextDecoder().decode(buf));
      }

      /* запомненный ключ: лежит в localStorage этого браузера, пока не нажата «выйти» */
      const KEY_NAME = "lk";
      const readSaved = () => { try { return localStorage.getItem(KEY_NAME); } catch (e) { return null; } };
      const writeSaved = raw => { try { localStorage.setItem(KEY_NAME, btoa(String.fromCharCode(...raw))); } catch (e) {} };
      const clearSaved = () => { try { localStorage.removeItem(KEY_NAME); } catch (e) {} };

      /* ---------- Избранное ----------
         Хранится только на этом устройстве: с галочкой «запомнить меня» в localStorage, без неё — в sessionStorage.
         Кнопка «выйти» стирает избранное вместе с ключом. */
      const FAV_NAME = "fav";
      const NOTE_SVG = '<svg viewBox="0 0 13 13" shape-rendering="crispEdges" aria-hidden="true"><path class="frame" d="M3 1h7v1h-7zM2 2h9v7h-9zM2 9h4v1h-4zM7 9h4v1h-4zM2 10h3v1h-3zM8 10h3v1h-3zM2 11h1v1h-1zM10 11h1v1h-1z"/></svg>';
      const favBtn = $("fav-btn");
      let favs = new Set(), curIndex = -1;
      const favKey = l => l.title + "\n" + (l.date || "");
      const favStore = () => { try { return readSaved() ? localStorage : sessionStorage; } catch (e) { return null; } };
      const loadFavs = () => {
        favs = new Set();
        try { const a = JSON.parse(favStore().getItem(FAV_NAME) || "[]"); if (Array.isArray(a)) a.forEach(k => favs.add(k)); } catch (e) {}
      };
      const saveFavs = () => { try { favStore().setItem(FAV_NAME, JSON.stringify([...favs])); } catch (e) {} };
      const clearFavs = () => { favs = new Set(); try { localStorage.removeItem(FAV_NAME); sessionStorage.removeItem(FAV_NAME); } catch (e) {} };
      const addMark = btn => {
        const m = document.createElement("span");
        m.className = "fav-mark";
        m.setAttribute("aria-hidden", "true");
        m.innerHTML = NOTE_SVG;
        btn.appendChild(m);
      };
      const updateMark = i => {
        const b = list.querySelector('[data-i="' + i + '"]');
        if (!b || !letters[i]) return;
        const m = b.querySelector(".fav-mark"), on = favs.has(favKey(letters[i]));
        if (on && !m) addMark(b); else if (!on && m) m.remove();
      };
      const syncFav = () => {
        const on = !!letters[curIndex] && favs.has(favKey(letters[curIndex]));
        favBtn.classList.toggle("on", on);
        favBtn.setAttribute("aria-pressed", on);
        favBtn.setAttribute("aria-label", on ? "Убрать из избранного" : "В избранное");
      };
      favBtn.addEventListener("click", () => {
        const l = letters[curIndex];
        if (!l) return;
        const k = favKey(l), on = !favs.has(k);
        if (on) favs.add(k); else favs.delete(k);
        saveFavs();
        syncFav();
        updateMark(curIndex);
        favBtn.classList.remove("pop", "spark");
        void favBtn.offsetWidth;                  // перезапуск анимации
        favBtn.classList.add("pop");
        if (on) favBtn.classList.add("spark");
      });


      /* показать главную и кнопку выхода */
      function showHome() {
        loadFavs();
        home.hidden = false;
        $("logout").hidden = false;
        document.body.classList.add("in");        // экран после входа
        renderList();
      }

      function say(text, working) {
        gateText.textContent = text;
        loader.hidden = !working;
        gate.classList.toggle("bad", !working && !!text);
      }

      function fail(text) {
        busy = false;
        say(text, false);
        gate.classList.remove("shake");
        void gate.offsetWidth;                       // перезапуск анимации тряски
        gate.classList.add("shake");
        pass.value = "";
      }

      gate.addEventListener("submit", async e => {
        e.preventDefault();
        if (busy || !pass.value) return;
        busy = true;
        gate.classList.remove("shake");
        say("расшифровка", true);

        let v;
        try { v = await loadVault(); } catch (err) { return fail("архив недоступен"); }
        let raw;
        try { raw = await deriveRaw(pass.value, v); letters = await openVault(raw, v); } catch (err) { return fail("неверный код"); }
        if ($("gate-remember").checked) writeSaved(raw);   // галочка стоит — запоминаем ключ, иначе после перезагрузки код спросят снова
        else clearSaved();

        pass.value = "";
        setEye(false);
        say("", false);
        gate.classList.add("done");
        about.classList.add("done");
        if (!isOff()) await new Promise(r => setTimeout(r, 400));
        gate.hidden = true;
        about.hidden = true;
        showHome();
      });

      if (!window.crypto || !crypto.subtle) {
        pass.disabled = true;
        say("нужен https", false);
      } else {
        loadVault().catch(() => {});                 // качаем файл заранее
      }

      /* ---------- «Что за проект?»: окно раскрывается, текст печатается ---------- */
      const REPO = "https://github.com";             // сюда можно поставить ссылку на конкретный репозиторий
      const ABOUT = [                                // части текста; у части с href получается ссылка, с f — оформление, с e — цветной пиксельный значок в начале абзаца (занимает 1 символ)
        { t: "#", e: "note" },
        { t: "Онлайн-хранилище для заметок. Проект с " },
        { t: "открытым исходным кодом", href: REPO },
        { t: ": вы можете развернуть его самостоятельно и полностью контролировать хостинг и содержимое сайта при соблюдении лицензии.\n\n" },
        { t: "#", e: "key" },
        { t: "Доступ к записям осуществляется по коду. Чтобы поделиться заметками, достаточно передать код тому, кому вы доверяете.\n\n" },
        { t: "#", e: "lock" },
        { t: "Все данные хранятся в сети только в зашифрованном виде. Без кода записи представляют собой случайный набор символов, а расшифровка происходит прямо в браузере. Код хранится в памяти браузера, пока активна сессия, и удаляется при выходе.\n\n" },
        { t: "#", e: "pencil" },
        { t: "Заметки поддерживают форматирование: " },
        { t: "выделение главного", f: "v" },
        { t: ", " },
        { t: "подчёркивание", f: "u" },
        { t: ", " },
        { t: "курсив", f: "i" },
        { t: " и " },
        { t: "жирный шрифт", f: "b" },
        { t: ". Понравившиеся записи можно добавлять в избранное" },
        { t: ". Дизайн выполнен в космической тематике" },
        { t: " и адаптирован под любые устройства.\n\n" },
        { t: "#", e: "person" },
        { t: "Сайт используется по назначению и является приватным. Если вы хотите разместить заметки на этом домене без собственного хоста — свяжитесь со мной.\n\n" },
        { t: "#", e: "play" },
        { t: "Для перехода в демонстрационный режим введите код доступа: " },
        { t: "DEMO", f: "v" }
      ];

      /* пиксельные значки в начале абзацев окна «что за проект?»: рисуются по сетке, как остальные значки сайта.
         Каждая буква — цвет из PAL, «.» — пусто. Чтобы добавить новый, допишите его сюда и поставьте в ABOUT: { t: "#", e: "имя" } */
      const PAL = { y: "#f2c230", o: "#d9831a", r: "#e5484d", R: "#a52a2e", b: "#4c8dff", B: "#2457c5",
                    g: "#3fb950", G: "#237a33", s: "#9aa0a6", S: "#5f6368", n: "#ecd09a", k: "#8b5a2b", c: "#35c0d8",
                    h: "#d9a441", d: "#6b4423", u: "#c0661a", a: "#e0a030", l: "#f2d98a", p: "#f0c9a0" };
      const PIX = {
        note:   [".kkkkkkk.", ".knnnnnk.", ".knkkknk.", ".knnnnnk.", ".knkkknk.", ".knnnnnk.", ".knkknnk.", ".knnnnnk.", ".kkkkkkk."],
        key:    [".ddd.....", "dhhhd....", "dhhhhhhhh", "dhhhd.d.d", ".ddd....."],
        lock:   ["..sssss..", ".ss...ss.", ".ss...ss.", "ddddddddd", "duuuuuuud", "duuuduuud", "duuuduuud", "duuuuuuud", "ddddddddd"],
        pencil: ["......rr", ".....rrr", "....sss.", "...yyy..", "..yyy...", ".nnn....", "nnn.....", "k......."],
        person: ["..kkkkk..", "..kkkkk..", "..kpppk..", "..kpppk..", "...ppp...", ".aaaaaaa.", "aaaaaaaaa", "aaaaaaaaa", "aaaaaaaaa"],
        play:   ["ll.......", "llll.....", "llllll...", "llllllll.", "lllllllll", "hhhhhhhh.", "hhhhhh...", "hhhh.....", "hh......."]
      };

      function pixIcon(name) {
        const rows = PIX[name], h = rows.length, w = rows[0].length;
        const NS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(NS, "svg");
        svg.setAttribute("viewBox", `0 0 ${w} ${h}`);
        svg.setAttribute("shape-rendering", "crispEdges");
        svg.setAttribute("aria-hidden", "true");
        const paths = {};                              // цвет → путь из горизонтальных отрезков
        rows.forEach((r, y) => {
          for (const m of r.matchAll(/([^.])\1*/g)) paths[m[1]] = (paths[m[1]] || "") + `M${m.index} ${y}h${m[0].length}v1h-${m[0].length}z`;
        });
        for (const c in paths) {
          const p = document.createElementNS(NS, "path");
          p.setAttribute("d", paths[c]);
          p.setAttribute("fill", PAL[c]);
          svg.append(p);
        }
        const el = document.createElement("span");
        el.className = "px-e";
        el.style.setProperty("--w", w);
        el.style.setProperty("--h", h);
        el.setAttribute("aria-hidden", "true");
        el.append(svg);
        return el;
      }
      const ABOUT_LEN = ABOUT.reduce((s, p) => s + p.t.length, 0);
      const about = $("about"), aboutBtn = $("about-btn"), aboutText = $("about-text");
      let typeRaf = 0;

      function extLink(href, text) {
        const a = document.createElement("a");
        a.className = "ext";
        a.href = href;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = text;
        return a;
      }

      /* выводит символы [from, to) описания в контейнер, сохраняя ссылку */
      function renderAbout(parent, from, to) {
        let pos = 0;
        for (const p of ABOUT) {
          const a = Math.max(from, pos), b = Math.min(to, pos + p.t.length);
          if (b > a) {
            const s = p.t.slice(a - pos, b - pos);
            if (p.e) parent.append(pixIcon(p.e));
            else if (p.href) parent.append(extLink(p.href, s));
            else if (p.f) {
              const [tag, cls] = RICH[p.f];          // те же стили, что и в письмах
              const el = document.createElement(tag);
              if (cls) el.className = cls;
              el.textContent = s;
              parent.append(el);
            } else parent.append(document.createTextNode(s));
          }
          pos += p.t.length;
        }
      }

      function typeAbout() {
        cancelAnimationFrame(typeRaf);
        aboutText.textContent = "";
        if (isOff()) { renderAbout(aboutText, 0, ABOUT_LEN); return; }
        const typed = document.createElement("span"), rest = document.createElement("span");
        rest.className = "ghost";
        aboutText.append(typed, rest);
        const t0 = performance.now() + 150;          // печать стартует чуть позже начала раскрытия
        const step = now => {
          const n = Math.min(ABOUT_LEN, Math.max(0, Math.floor((now - t0) / 0.9)));   // ≈ 1100 символов в секунду (чем меньше делитель, тем быстрее печать)
          typed.textContent = rest.textContent = "";
          renderAbout(typed, 0, n);
          renderAbout(rest, n, ABOUT_LEN);
          if (n < ABOUT_LEN) typeRaf = requestAnimationFrame(step);
          else { aboutText.textContent = ""; renderAbout(aboutText, 0, ABOUT_LEN); }
        };
        typeRaf = requestAnimationFrame(step);
      }

      function toggleAbout(open) {
        about.classList.toggle("open", open);
        aboutBtn.setAttribute("aria-expanded", open);
        if (open) typeAbout();
        else { cancelAnimationFrame(typeRaf); aboutBtn.blur(); }   // снимаем фокус, чтобы кнопка гасла на телефоне
      }

      /* на телефоне окно закрывается свайпом вниз (если текст пролистан до верха) */
      let swipeY = null, swipeX = 0;
      document.addEventListener("touchstart", e => {
        if (!about.classList.contains("open") || e.touches.length !== 1) { swipeY = null; return; }
        /* если текст длинный и листается внутри окна, свайп вниз — это прокрутка, а не закрытие;
           закрывает он только когда текст уже пролистан до самого верха */
        const clip = about.querySelector(".about-clip");
        if (clip.contains(e.target) && clip.scrollHeight > clip.clientHeight + 1 && clip.scrollTop > 0) { swipeY = null; return; }
        swipeY = e.touches[0].clientY;
        swipeX = e.touches[0].clientX;
      }, { passive: true });
      document.addEventListener("touchend", e => {
        if (swipeY === null) return;
        const t = e.changedTouches[0];
        const dy = t.clientY - swipeY, dx = Math.abs(t.clientX - swipeX);
        swipeY = null;
        const clip = about.querySelector(".about-clip");
        if (clip.scrollTop > 0) return;                 // текст сдвинулся — это была прокрутка
        if (dy > 50 && dy > dx * 1.5) toggleAbout(false);
      }, { passive: true });
      document.addEventListener("touchcancel", () => { swipeY = null; }, { passive: true });
      aboutBtn.addEventListener("click", () => toggleAbout(!about.classList.contains("open")));
      /* на телефоне нажатие в любом месте экрана, кроме самого окна с текстом, тоже закрывает описание */
      const touchOnly = window.matchMedia("(hover: none)");
      document.addEventListener("click", e => {
        if (!touchOnly.matches || !about.classList.contains("open")) return;
        if (about.querySelector(".about-panel").contains(e.target) || aboutBtn.contains(e.target)) return;
        toggleAbout(false);
      });

      /* Обновление свайпом вниз оставляем браузеру: сайт не перехватывает жест. */

      /* после «назад» из кэша браузера страница перезагружается: без запомненного ключа снова просим код */
      addEventListener("pageshow", e => { if (e.persisted) location.reload(); });

      /* ---------- Автоматический вход и выход ----------
         Если на устройстве запомнен ключ, письма открываются без кода. Не подошёл (код сменили) — просим код заново. */
      function showGate(msg) {
        gate.hidden = false;
        about.hidden = false;
        say(msg, false);
      }
      if (window.crypto && crypto.subtle && readSaved()) {
        gate.hidden = true;                          // не показываем окно входа, пока проверяем ключ
        about.hidden = true;
        (async () => {
          let v;
          try { v = await loadVault(); } catch (err) { return showGate("архив недоступен"); }
          try { letters = await openVault(b64(readSaved()), v); } catch (err) { clearSaved(); return showGate(""); }
          showHome();
        })();
      }
      /* подъём блока кода привязан к полю кода, а не к :focus-within: клик по «запомнить меня» (в том числе на телефоне,
         где метка забирает фокус себе) не должен его опускать. Опускается только когда фокус ушёл куда-то ещё. */
      /* экранная клавиатура на телефоне: браузер уменьшает видимую область, и кнопка «что за проект?» (она закреплена у нижнего края)
         подпрыгивала вместе с ней. Пока клавиатура открыта, кнопка плавно прячется (класс kb на body), потом так же возвращается на место. */
      const vv = window.visualViewport, coarse = matchMedia("(pointer: coarse)");
      let baseW = 0, baseH = 0;
      const checkKb = () => {
        const w = innerWidth, hh = vv ? vv.height : innerHeight;
        if (w !== baseW) { baseW = w; baseH = hh; }          // ширина изменилась (поворот экрана): считаем заново
        baseH = Math.max(baseH, hh);                         // полная высота без клавиатуры
        document.body.classList.toggle("kb", coarse.matches && baseH - hh > 120);
      };
      if (vv) vv.addEventListener("resize", checkKb);
      addEventListener("resize", checkKb);
      checkKb();
      const gateBox = document.querySelector(".gate-box"), remember = document.querySelector(".remember");
      let keepLift = false, keepTimer = 0;
      pass.addEventListener("focus", () => gateBox.classList.add("lift"));
      pass.addEventListener("blur", () => { if (!keepLift) gateBox.classList.remove("lift"); });
      remember.addEventListener("mousedown", e => e.preventDefault());
      remember.addEventListener("pointerdown", () => {
        keepLift = gateBox.classList.contains("lift");
        clearTimeout(keepTimer);
        keepTimer = setTimeout(() => {            // клик не случился (палец увели в сторону): возвращаем обычное поведение
          if (keepLift) { keepLift = false; if (document.activeElement !== pass) gateBox.classList.remove("lift"); }
        }, 700);
      });
      remember.addEventListener("click", () => {
        keepLift = false;
        clearTimeout(keepTimer);
      });
      /* шестерёнка: раскрывает / сворачивает кнопки; нажатие в любом другом месте сворачивает.
         В режиме «пустота» меню остаётся как было, чтобы глаз вернулся на своё место в нём. */
      const gear = $("gear");
      const setMenu = on => { document.body.classList.toggle("menu", on); gear.setAttribute("aria-expanded", on); };
      gear.addEventListener("click", () => setMenu(!document.body.classList.contains("menu")));
      document.addEventListener("pointerdown", e => {
        const b = document.body;
        if (!b.classList.contains("menu") || b.classList.contains("peek")) return;
        if (e.target.closest(".gear-toggle, .theme-toggle, .motion-toggle, .sound-toggle, .peek-toggle")) return;
        setMenu(false);
      });

      /* строки лицензий выравниваются по краю самих букв: у «i» слева пустое поле, из-за чего «ibuzy projects» казалось сдвинутым вправо */
      function alignLic() {
        const c = document.createElement("canvas").getContext("2d");
        document.querySelectorAll(".lic-item span").forEach(sp => {
          const cs = getComputedStyle(sp);
          c.font = cs.fontStyle + " " + cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
          const m = c.measureText(sp.textContent.trim().charAt(0));
          sp.style.marginLeft = (Math.round(m.actualBoundingBoxLeft * 2) / 2) + "px";   // чернила правее начала строки: сдвигаем влево
        });
      }
      if (document.fonts && document.fonts.load) document.fonts.load("10px ArchiveFont").then(alignLic, alignLic);
      else alignLic();

      /* лицензии: кнопка «L» раскрывает / сворачивает две ссылки; нажатие в другом месте и Esc сворачивают */
      const licBtn = $("lic-btn");
      const setLic = on => { document.body.classList.toggle("lic-open", on); licBtn.setAttribute("aria-expanded", on); };
      licBtn.addEventListener("click", () => setLic(!document.body.classList.contains("lic-open")));
      document.addEventListener("pointerdown", e => {
        if (!document.body.classList.contains("lic-open")) return;
        if (e.target.closest(".lic-toggle, .lic-list")) return;
        setLic(false);
      });
      document.addEventListener("keydown", e => { if (e.key === "Escape") setLic(false); });

      /* «пустота»: класс на body прячет всё, кроме фона и самой кнопки. Состояние нигде не хранится: после перезагрузки сбрасывается */
      $("peek").addEventListener("click", () => {
        const on = !document.body.classList.contains("peek");
        document.body.classList.toggle("peek", on);
        $("peek").setAttribute("aria-pressed", on);
        if (on && document.activeElement && document.activeElement !== $("peek")) document.activeElement.blur();   // убираем клавиатуру на телефоне
      });
      $("logout").addEventListener("click", () => { clearSaved(); clearFavs(); location.reload(); });

      /* ---------- Список писем на главной ---------- */
      function renderList() {
        list.textContent = "";
        $("count").textContent = "количество заметок: " + letters.length;
        /* заметки появляются по одной друг за другом; при большом количестве шаг короче, вся очередь укладывается примерно в секунду */
        list.style.setProperty("--step", Math.min(.06, .8 / Math.max(1, letters.length - 1)) + "s");
        letters.forEach((l, i) => {
          const li = document.createElement("li");
          const b = document.createElement("button");
          b.className = "link";
          b.type = "button";
          const t = document.createElement("span");       // название в одну строку: не помещается — ставится «…»
          t.className = "t";
          t.textContent = t.dataset.full = l.title;
          b.appendChild(t);
          b.title = l.title;                              // полное название во всплывающей подсказке
          b.dataset.i = i;
          if (favs.has(favKey(l))) addMark(b);
          li.style.setProperty("--i", i);
          li.appendChild(b);
          list.appendChild(li);
        });
        requestAnimationFrame(fitTitles);
      }

      /* Названия в одну строку. Если название шире ячейки, оно обрезается по символам и в конце ставится «…»;
         пробелы перед «…» не оставляются (обрезанная часть очищается от пробелов в конце). Пробелы при подсчёте учитываются.
         Ширина меряется через canvas, поэтому число символов подбирается под шрифт и размер экрана на каждом устройстве. */
      const measureCtx = document.createElement("canvas").getContext("2d");
      function fitTitles() {
        const spans = list.querySelectorAll(".link .t");
        if (!spans.length) return;
        const first = spans[0], cs = getComputedStyle(first);
        measureCtx.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
        if ("letterSpacing" in measureCtx) measureCtx.letterSpacing = cs.letterSpacing === "normal" ? "0px" : cs.letterSpacing;
        const w = t => measureCtx.measureText(t).width;
        spans.forEach(span => {
          const avail = span.closest("li").clientWidth - 1;       // ширина ячейки (кнопка не шире неё)
          const full = span.dataset.full;
          if (avail <= 0) return;                                  // список скрыт: посчитаем, когда появится
          if (w(full) <= avail) { span.textContent = full; return; }
          const chars = Array.from(full);
          let lo = 0, hi = chars.length - 1;                       // наибольшее число символов, при котором «текст…» помещается
          while (lo < hi) {
            const mid = (lo + hi + 1) >> 1;
            if (w(chars.slice(0, mid).join("").trimEnd() + "…") <= avail) lo = mid; else hi = mid - 1;
          }
          span.textContent = chars.slice(0, lo).join("").trimEnd() + "…";
        });
      }
      let fitRaf = 0;
      const refit = () => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(fitTitles); };
      if (window.ResizeObserver) new ResizeObserver(refit).observe(list);
      addEventListener("resize", refit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);

      /* Подпись под списком: всегда в одну строку. Шрифт 12px, а если она шире экрана (телефон), он уменьшается до целого размера, при котором всё помещается. */
      const noteEl = document.querySelector(".note");
      function fitNote() {
        const box = noteEl.parentElement, bs = getComputedStyle(box), ns = getComputedStyle(noteEl);
        const avail = box.clientWidth - parseFloat(bs.paddingLeft) - parseFloat(bs.paddingRight)
                      - parseFloat(ns.paddingLeft) - parseFloat(ns.paddingRight);
        if (avail <= 0) return;                                    // страница скрыта: посчитаем, когда появится
        const c = document.createElement("canvas").getContext("2d");
        c.font = `${ns.fontStyle} ${ns.fontWeight} 12px ${ns.fontFamily}`;
        const w12 = c.measureText(noteEl.textContent).width;
        noteEl.style.fontSize = Math.max(6, Math.min(12, Math.floor(12 * (avail - 1) / w12))) + "px";
      }
      let noteRaf = 0;
      const refitNote = () => { cancelAnimationFrame(noteRaf); noteRaf = requestAnimationFrame(fitNote); };
      if (window.ResizeObserver) new ResizeObserver(refitNote).observe(noteEl.parentElement);
      addEventListener("resize", refitNote);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitNote);
      /* тонкая полоска прокрутки справа от блока заметок: видна, только если заметки не помещаются */
      const listWrap = $("letters-wrap"), sbar = $("sbar"), thumb = $("sbar-thumb");
      const updateBar = () => {
        const sh = listWrap.scrollHeight, ch = listWrap.clientHeight;
        const more = sh > ch + 2;
        sbar.classList.toggle("on", more);
        if (!more) return;
        const track = sbar.clientHeight;
        const th = Math.max(24, track * ch / sh);
        const max = sh - ch;
        thumb.style.height = th + "px";
        thumb.style.transform = "translateY(" + ((track - th) * (max ? listWrap.scrollTop / max : 0)) + "px)";
      };
      listWrap.addEventListener("scroll", updateBar, { passive: true });
      if (window.ResizeObserver) { const ro = new ResizeObserver(updateBar); ro.observe(listWrap); ro.observe(list); }
      addEventListener("resize", updateBar);

      /* за полоску можно цепляться пальцем или мышью: тянем ползунок или тапаем по дорожке */
      let grab = null;
      const dragTo = y => {
        const tr = sbar.getBoundingClientRect(), th = thumb.offsetHeight;
        const span = tr.height - th, max = listWrap.scrollHeight - listWrap.clientHeight;
        if (span <= 0) return;
        const pos = Math.min(span, Math.max(0, y - tr.top - grab));
        listWrap.scrollTop = pos / span * max;
      };
      sbar.addEventListener("pointerdown", e => {
        if (!sbar.classList.contains("on")) return;
        const t = thumb.getBoundingClientRect();
        grab = (e.clientY >= t.top && e.clientY <= t.bottom) ? e.clientY - t.top : t.height / 2;
        sbar.setPointerCapture(e.pointerId);
        sbar.classList.add("drag");
        dragTo(e.clientY);
        e.preventDefault();
      });
      sbar.addEventListener("pointermove", e => { if (grab !== null) dragTo(e.clientY); });
      const endDrag = () => { grab = null; sbar.classList.remove("drag"); };
      sbar.addEventListener("pointerup", endDrag);
      sbar.addEventListener("pointercancel", endDrag);

      list.addEventListener("click", e => {
        const b = e.target.closest("[data-i]");
        if (b) openLetter(+b.dataset.i, b);
      });

      /* ---------- Смена темы ---------- */
      $("theme-toggle").addEventListener("click", () => {
        const dark = root.dataset.theme !== "dark";
        if (dark) root.dataset.theme = "dark"; else delete root.dataset.theme;
        try { localStorage.setItem("theme", dark ? "dark" : "light"); } catch (e) {}
      });

      /* ---------- Анимации: включить / отключить ---------- */
      const motionBtn = $("motion-toggle");
      const syncMotion = () => motionBtn.setAttribute("aria-pressed", !isOff());
      motionBtn.addEventListener("click", () => {
        const off = !isOff();
        if (off) root.dataset.motion = "off"; else delete root.dataset.motion;
        try { localStorage.setItem("motion", off ? "off" : "on"); } catch (e) {}
        syncMotion();
      });
      syncMotion();

      /* ---------- Звук нажатий: sounds/click.mp3 ----------
         По умолчанию выключен. Включается кнопкой под кнопкой анимаций, выбор запоминается.
         Играет при нажатии на любую кнопку. mp3 выбран потому, что его понимают все браузеры, включая iPhone. */
      const soundBtn = $("sound-toggle");
      const soundOn = () => root.dataset.sound === "on";
      /* Web Audio: файл скачивается и декодируется один раз, каждое нажатие — лёгкий одноразовый источник.
         Так быстрые нажатия не создают кучу <audio> и не упираются в лимиты браузера. */
      const SND_URL = "sounds/click.mp3", SND_VOL = .6;
      const AC = window.AudioContext || window.webkitAudioContext;
      let ac = null, rawP = null, bufP = null, snd = null, fallback = null;

      function getBuffer() {
        if (snd) return Promise.resolve(snd);
        if (!bufP) {
          rawP = rawP || fetch(SND_URL).then(r => { if (!r.ok) throw new Error("http"); return r.arrayBuffer(); });
          bufP = rawP
            .then(ab => new Promise((ok, no) => ac.decodeAudioData(ab.slice(0), ok, no)))   // колбэки — для старых Safari
            .then(b => (snd = b))
            .catch(err => { bufP = rawP = null; throw err; });                                // при сбое попробуем заново
        }
        return bufP;
      }

      function playClick() {
        if (!soundOn()) return;
        try {
          if (!AC) {                                  // совсем старый браузер: один <audio>, перематываем в начало
            fallback = fallback || new Audio(SND_URL);
            fallback.currentTime = 0;
            fallback.volume = SND_VOL;
            fallback.play().catch(() => {});
            return;
          }
          if (!ac) ac = new AC();                     // создаём внутри нажатия — иначе браузер не разрешит звук
          if (ac.state !== "running") ac.resume().catch(() => {});
          getBuffer().then(buf => {
            const src = ac.createBufferSource(), g = ac.createGain();
            src.buffer = buf;
            g.gain.value = SND_VOL;
            src.connect(g);
            g.connect(ac.destination);
            src.start(0);
          }).catch(() => {});
        } catch (e) {}
      }
      const syncSound = () => soundBtn.setAttribute("aria-pressed", soundOn());
      soundBtn.addEventListener("click", () => {
        const on = !soundOn();
        if (on) root.dataset.sound = "on"; else delete root.dataset.sound;
        try { localStorage.setItem("sound", on ? "on" : "off"); } catch (e) {}
        syncSound();
      });
      syncSound();
      /* слушатель на документе срабатывает после обработчика самой кнопки,
         поэтому при включении звука кнопка щёлкает сразу, а при выключении — молчит */
      document.addEventListener("click", e => { if (e.target.closest("button, input[type=checkbox]")) playClick(); });

      /* ---------- Логотип уезжает вверх и гаснет, пока листается письмо ----------
         На телефоне вместе с ним уезжают и кнопки управления (тема, анимации, звук, выйти). */
      const brand = document.querySelector(".brand");
      const ctrls = [...document.querySelectorAll(".theme-toggle, .motion-toggle, .sound-toggle, .logout-toggle")];
      const phone = matchMedia("(max-width: 600px)");
      const resetAway = () => [brand, ...ctrls].forEach(el => { el.style.transform = el.style.opacity = el.style.pointerEvents = ""; });
      function scrollAway() {
        /* двигаем логотип и кнопки только пока заметка открыта. После закрытия просмотрщик ещё какое-то время
           остаётся в странице и может менять scrollTop (прячется адресная строка на телефоне, подрезается прокрутка) —
           раньше из-за этого логотип улетал вверх уже на главной странице */
        if (!viewer.classList.contains("open")) { resetAway(); return; }
        const y = viewer.scrollTop;
        const move = (el, on) => {
          el.style.transform = on && y ? `translateY(${-y}px)` : "";
          el.style.opacity = on && y ? Math.max(0, 1 - y / 50) : "";
          el.style.pointerEvents = on && y > 30 ? "none" : "";
        };
        move(brand, true);
        ctrls.forEach(b => move(b, phone.matches));
      }
      viewer.addEventListener("scroll", scrollAway, { passive: true });
      phone.addEventListener("change", scrollAway);

      /* ---------- Разбор текста письма (без innerHTML) ---------- */
      const RICH = { v: ["span", "hl"], u: ["u", ""], i: ["em", ""], b: ["strong", ""] };

      function addText(parent, str) {
        str.split("\n").forEach((part, i) => {
          if (i) parent.appendChild(document.createElement("br"));
          if (part) parent.appendChild(document.createTextNode(part));
        });
      }

      /* форматирование: <v>выделение</v> <u>подчёркнутое</u> <i>курсив</i> <b>жирный</b>
         и ссылка: <a href="https://...">текст</a> (только http/https) */
      function renderRich(text, parent) {
        const re = /<(v|u|i|b)>([\s\S]*?)<\/\1>|<a href="(https?:\/\/[^"\s]+)">([\s\S]*?)<\/a>/g;
        let last = 0, m;
        while ((m = re.exec(text))) {
          if (m.index > last) addText(parent, text.slice(last, m.index));
          let el;
          if (m[3]) {
            el = extLink(m[3], "");
            renderRich(m[4], el);
          } else {
            const [tag, cls] = RICH[m[1]];
            el = document.createElement(tag);
            if (cls) el.className = cls;
            renderRich(m[2], el);
          }
          parent.appendChild(el);
          last = re.lastIndex;
        }
        if (last < text.length) addText(parent, text.slice(last));
      }

      function openLetter(index, trigger) {
        const l = letters[index];
        if (!l) return;
        lastTrigger = trigger;
        curIndex = index;
        favBtn.classList.remove("pop", "spark");
        syncFav();

        titleEl.textContent = l.title;
        dateEl.textContent = l.date || "";
        bodyEl.textContent = "";
        l.text.split("\n").map(s => s.trim()).join("\n").trim().split(/\n{2,}/).forEach(t => {
          const p = document.createElement("p");
          renderRich(t, p);
          bodyEl.appendChild(p);
        });
        if (l.sign) {
          const s = document.createElement("p");
          s.className = "sign";
          s.textContent = l.sign;
          bodyEl.appendChild(s);
        }

        viewer.scrollTop = 0;
        document.body.classList.add("reading");
        viewer.setAttribute("aria-hidden", "false");
        void viewer.offsetWidth;                 // фиксируем начальный кадр, чтобы переход точно запустился
        viewer.classList.add("open");
        setTimeout(() => backBtn.focus({ preventScroll: true }), 300);
        history.pushState({ letter: index }, "");
      }

      function closeLetter(fromPopState) {
        if (!viewer.classList.contains("open")) return;
        viewer.classList.remove("open");
        viewer.setAttribute("aria-hidden", "true");
        document.body.classList.remove("reading");
        resetAway();                              // логотип и кнопки (на телефоне) возвращаются на место, а не только логотип
        setTimeout(() => { if (!viewer.classList.contains("open")) viewer.scrollTop = 0; }, 1050);   // когда окно уже скрыто, сбрасываем старую прокрутку
        if (lastTrigger) lastTrigger.focus({ preventScroll: true });
        if (!fromPopState && history.state && history.state.letter !== undefined) history.back();
      }

      backBtn.addEventListener("click", () => closeLetter(false));
      document.addEventListener("keydown", e => {
        if (e.key !== "Escape") return;
        closeLetter(false);
        if (about.classList.contains("open")) toggleAbout(false);
      });
      addEventListener("popstate", () => closeLetter(true));

      /* ---------- Летающие пиксели ----------
         Пиксели медленно плывут вверх, покачиваются, мерцают ступенями
         и разлетаются от курсора. Цвет берётся из темы. */
      (() => {
        const cv = $("px"), ctx = cv.getContext("2d");
        const dots = [];
        const comets = []; // кометы с коротким распадающимся хвостом
        let W = 0, H = 0, D = 1, color = "#111", last = 0, raf = 0, mx = -999, my = -999;

        const rnd = (a, b) => a + Math.random() * (b - a);
        const spawn = anywhere => ({
          x: rnd(0, W), y: anywhere ? rnd(0, H) : H,                // новые пиксели появляются у нижней границы
          s: [2, 2, 3, 3, 4][(Math.random() * 5) | 0],   // размер пикселя
          v: rnd(32, 80),                                 // скорость вверх, px/с (всегда быстрее созвездий)
          a: rnd(.2, .6),                                 // прозрачность
          amp: rnd(4, 14), f: rnd(.2, .7), p: rnd(0, 6.28),
          tw: rnd(.4, 1.3), tp: rnd(0, 6.28),             // мерцание
          ox: 0, oy: 0                                    // смещение от курсора
        });

        /* ---------- Кометы ----------
           Комета падает по баллистической дуге, как брошенное тело: по горизонтали летит равномерно, а вниз её тянет
           постоянное ускорение, поэтому путь — настоящая парабола (сначала почти горизонтально, потом всё круче).
           Голова — тёмное неровное ядро с освещённым боком и слабой комой; за ней по пройденному пути тянется
           длинный хвост, который расширяется и гаснет. Чем быстрее комета, тем хвост длиннее. Палитра приглушённая. */
        const cometPalette = [
          [218, 190, 119], [199, 164, 91], [230, 207, 151],
          [184, 150, 77], [211, 177, 111], [236, 216, 166]
        ];
        /* ядро: h — освещённый бок, m — основной цвет, d — тень; неровный силуэт, не круг и не звезда */
        const COMET_ROCK = [
          "..mmm..",
          ".mhhmm.",
          "mhhhmmd",
          "mhhmmdd",
          ".mmmddd",
          ".dmmdd.",
          "..ddd.."
        ];
        function spawnComet() {
          const dir = Math.random() < .5 ? 1 : -1;
          const T = rnd(2.6, 3.6);                                          // время полёта до нижнего края, с
          const travel = Math.min(Math.max(rnd(.45, .9) * W, 340), W + 40);  // сдвиг по горизонтали за весь полёт
          const room = Math.max(0, W + 40 - travel);
          const sx = rnd(-30, -30 + room);                                   // старт выбран так, чтобы дуга осталась на экране
          const y0 = rnd(-24, H * .22), vy0 = rnd(10, 60);
          const fall = H + 50 - y0;                                          // сколько надо пролететь вниз
          return {
            dir, T, x0: dir > 0 ? sx : W - sx, y0, vy0,
            vx: travel / T,                                                  // скорость по горизонтали, px/с
            g: 2 * (fall - vy0 * T) / (T * T),                               // ускорение вниз, px/с²
            x: 0, y: 0, life: 0, acc: 0, trail: [],
            color: cometPalette[(Math.random() * cometPalette.length) | 0],
            flickerSeed: rnd(0, 100)
          };
        }
        function drawComet(q, dt, t) {
          q.life += dt;
          const L = q.life;
          q.x = q.x0 + q.dir * q.vx * L;
          q.y = q.y0 + q.vy0 * L + .5 * q.g * L * L;
          if (q.y > H + 40 || q.x < -60 || q.x > W + 60) return true;       // ушла за край — убираем
          const vx = q.dir * q.vx, vy = q.vy0 + q.g * L;
          const sp = Math.hypot(vx, vy) || 1;
          const ux = vx / sp, uy = vy / sp, nx = -uy, ny = ux;              // направление движения и перпендикуляр

          // точки хвоста оставляются на пройденном пути; их разброс и жизнь неровные, поэтому края хвоста рваные
          q.acc += dt * 110;
          while (q.acc >= 1) {
            q.acc -= 1;
            q.trail.push({ x: q.x, y: q.y, nx, ny, age: 0, life: rnd(.55, .95), r: rnd(-1, 1), tone: Math.random(), sz: rnd(1.6, 3) });
          }

          const [r, g, b] = q.color;
          const fadeIn = Math.min(1, L * 3);
          const edge = Math.max(0, Math.min(1, (H + 30 - q.y) / 140, (q.x + 30) / 100, (W + 30 - q.x) / 100));
          const alpha = Math.min(fadeIn, edge);
          const flicker = .86 + .14 * Math.sin(t * 9 + q.flickerSeed);       // у головы мерцание слабое: она не должна походить на звезду
          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          // хвост: от головы вглубь пути, расширяется и гаснет; ближе к голове светлее
          for (let i = q.trail.length - 1; i >= 0; i--) {
            const s = q.trail[i];
            s.age += dt;
            if (s.age >= s.life) { q.trail.splice(i, 1); continue; }
            const k = 1 - s.age / s.life;
            const spread = (1.5 + s.age * 26) * s.r;
            const mix = k * k * .65 * (s.tone > .55 ? 1 : .5);
            ctx.fillStyle = `rgb(${Math.round(r + (244 - r) * mix)},${Math.round(g + (229 - g) * mix)},${Math.round(b + (190 - b) * mix)})`;
            ctx.globalAlpha = alpha * k * k * (s.tone > .55 ? .8 : .5);
            const ss = Math.max(1, Math.round(s.sz * (.35 + .65 * k) * D));
            ctx.fillRect(Math.round((s.x + s.nx * spread) * D), Math.round((s.y + s.ny * spread) * D), ss, ss);
          }

          const gx = Math.round(q.x * D), gy = Math.round(q.y * D);
          // кома: слабая дымка вокруг ядра, смещённая назад
          ctx.fillStyle = `rgb(${r},${g},${b})`;
          for (let i = 0; i < 14; i++) {
            const d = rnd(-2, 13), side = rnd(-1, 1) * (3 + Math.max(0, d) * .45);
            ctx.globalAlpha = alpha * rnd(.07, .2) * flicker;
            const cs = Math.max(1, Math.round(rnd(1.6, 3) * D));
            ctx.fillRect(Math.round(gx - ux * d * D + nx * side * D), Math.round(gy - uy * d * D + ny * side * D), cs, cs);
          }
          ctx.restore();

          // ядро: неровный камень с освещённым боком
          ctx.save();
          const cell = Math.max(2, Math.round(1.7 * D));
          const hx = gx - Math.floor(cell * 3.5), hy = gy - Math.floor(cell * 3.5);
          const shade = { h: "rgb(244,229,190)", m: `rgb(${r},${g},${b})`, d: `rgb(${Math.round(r * .52)},${Math.round(g * .5)},${Math.round(b * .42)})` };
          ctx.globalAlpha = alpha * flicker;
          COMET_ROCK.forEach((row, y) => {
