          const lo = W < 600 ? 90 : 120, hi = W < 600 ? 170 : 260;
          const target = (lo + (hi - lo) * tsz) * rnd(.96, 1.04);       // наибольшая сторона в px
          const k = target / Math.max(c.w, c.h);
          const pw = c.w * k, ph = c.h * k;
          const m = Math.min(32, W * .05);
          /* из 80 случайных мест берём то, где зазор до ближайшего созвездия, планеты или чёрной дыры больше всего;
             новое созвездие выплывает не вплотную к нижнему краю, а с запасом, чтобы между ними по высоте тоже оставалось место */
          let bx = m, by = H, best = -1;
          for (let t = 0; t < 80; t++) {
            const x = rnd(m, Math.max(m, W - pw - m));
            const y = anywhere ? rnd(H * .05, Math.max(H * .06, H * .85 - ph * .5)) : H + rnd(60, 300);
            const r = { x0: x - 14, y0: y, x1: x + pw + 14, y1: y + ph + 14 };
            let gap = Infinity;
            for (const o of sky) gap = Math.min(gap, rectGap(r, skyRect(o)) * .8);   // чужие созвездия считаем «ближе», чтобы держаться от них дальше
            for (const o of planets.concat(holes)) gap = Math.min(gap, rectGap(r, planetRect(o)));
            if (gap > best) { best = gap; bx = x; by = y; }
          }
          return {
            c, k, pw, ph, age: 0,
            x: bx,
            y: by,
            v: rnd(18, 28),                                 // скорость вверх, px/с (медленнее любого пикселя)
            amp: rnd(6, 14), f: rnd(.08, .2), p: rnd(0, 6.28)
          };
        }

        function drawSky(q, t, dt) {
          q.y -= q.v * dt;
          /* линии начинают рисоваться, только когда созвездие целиком видно на экране (с подписью) */
          if (q.y + q.ph + 24 < H) q.age += dt;
          const c = q.c, k = q.k;
          if (q.y + q.ph < 0) return true;                      // ушло за верхний край: заменяем новым
          /* плавно проявляется, когда верхний край фигуры выходит снизу, и гаснет, когда нижний уходит вверх */
          const edge = H * .2;
          const a = clamp01((H - q.y) / edge) * clamp01((q.y + q.ph) / edge);
          if (a <= 0) return;
          const ox = q.x + Math.sin(t * q.f + q.p) * q.amp;
          const pt = i => [ox + (c.s[i][0] - c.x0) * k, q.y + (c.s[i][1] - c.y0) * k];

          /* линии: пунктир из пикселей, прорисовывается по очереди */
          const reveal = clamp01((q.age - .1) / 2) * c.e.length;
          ctx.globalAlpha = a * .38;
          for (let j = 0; j < c.e.length; j++) {
            const f = clamp01(reveal - j);
            if (f <= 0) break;
            const [x1, y1] = pt(c.e[j][0]), [x2, y2] = pt(c.e[j][1]);
            const len = Math.hypot(x2 - x1, y2 - y1), n = Math.floor(len * f / 5);
            for (let d = 0; d <= n; d++) {
              const u = d * 5 / len;
              ctx.fillRect(Math.round((x1 + (x2 - x1) * u) * D), Math.round((y1 + (y2 - y1) * u) * D), D, D);
            }
          }
          /* звёзды: квадратные пиксели, мерцают ступенями */
          for (let i = 0; i < c.s.length; i++) {
            const [x, y] = pt(i);
            const tw = (Math.sin(t * 1.1 + i * 1.7 + q.p) + 1) / 2;
            const size = Math.round((2 + c.s[i][2]) * D);
            ctx.globalAlpha = a * (.55 + .45 * tw);
            ctx.fillRect(Math.round(x * D), Math.round(y * D), size, size);
            if (c.s[i][2] === 2) {                                // яркие звёзды: крест из пикселей
              ctx.globalAlpha = a * .3 * (.4 + tw);
              const r = Math.round(3 * D), s1 = Math.round(D);
              ctx.fillRect(Math.round(x * D) + (size >> 1), Math.round(y * D) - r - s1, s1, r);
              ctx.fillRect(Math.round(x * D) + (size >> 1), Math.round(y * D) + size + s1, s1, r);
              ctx.fillRect(Math.round(x * D) - r - s1, Math.round(y * D) + (size >> 1), r, s1);
              ctx.fillRect(Math.round(x * D) + size + s1, Math.round(y * D) + (size >> 1), r, s1);
            }
          }
          /* название */
          const la = clamp01((q.age - 1.8) / 1) * a * .5;
          if (la > .01) {
            ctx.globalAlpha = la;
            ctx.font = labelFont();
            ctx.textBaseline = "top";
            ctx.fillText(c.n, Math.round(ox * D), Math.round((q.y + q.ph + 6) * D));
          }
        }

        /* ---------- Планеты ----------
           Все восемь планет Солнечной системы в виде крошечных пиксельных спрайтов приглушённых цветов:
           у каждой свои полосы, пятна и объём (светлая сторона сверху-слева, тень снизу-справа).
           Появляются в случайное время и в случайном месте снизу, медленно плывут вверх.
           Новая планета ставится только далеко от других планет и созвездий. */
        const CELL = 3;                                           // размер «пикселя» планеты, px
        const hexMul = (c, m) => {
          const n = parseInt(c.slice(1), 16);
          return "#" + [n >> 16, n >> 8, n].map(v => Math.max(0, Math.min(255, Math.round((v & 255) * m))).toString(16).padStart(2, "0")).join("");
        };
        const inDisc = (n, x, y) => Math.hypot(x - (n - 1) / 2, y - (n - 1) / 2) <= n / 2 - .05;
        function sphere(cells, n, ox, oy, colorAt) {              // шар n×n клеток с ступенчатой тенью
          const c = (n - 1) / 2;
          for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
            const col = inDisc(n, x, y) && colorAt(x, y);
            if (!col) continue;
            const l = ((c - x) * .6 + (c - y) * .8) / (n / 2);   // >0 — светлая сторона
            cells.push([ox + x, oy + y, hexMul(col, l < -.45 ? .58 : l < -.1 ? .8 : l > .55 ? 1.12 : 1)]);
          }
        }
        const fromMap = (rows, pal) => cells => sphere(cells, rows.length, 0, 0, (x, y) => pal[rows[y][x]]);
        const banded = (n, bands, spots = {}) => cells => sphere(cells, n, 0, 0, (x, y) => spots[x + "," + y] || bands[y]);

        const PLANET_DEFS = [
          { n: "меркурий", w: 5, h: 5, fill: fromMap(
              [".cab.", "caaab", "aabaa", "aaaab", ".aab."], { a: "#9a9288", b: "#6f685f", c: "#b3aca2" }) },
          { n: "венера", w: 7, h: 7, fill: fromMap(
              ["..ccc..", ".cccaa.", "ccaacca", "aaccaac", "ccaacca", ".aaccc.", "..aac.."], { a: "#bf9a62", c: "#d8bb88" }) },
          { n: "земля", w: 7, h: 7, fill: fromMap(
              ["..owo..", ".olloo.", "ollowoo", "oollooo", "woolloo", ".ooowo.", "..ooo.."], { o: "#4f79ad", l: "#5e9460", w: "#d5dde3" }) },
          { n: "марс", w: 5, h: 5, fill: fromMap(
              [".ppp.", "rrdrr", "rdrrr", "rrrdr", ".rrr."], { r: "#b9694c", d: "#8c4a37", p: "#dcd3cc" }) },
          { n: "юпитер", w: 11, h: 11, fill: cells => {
              const bands = ["#cdb48f", "#a97b55", "#d8c7aa", "#9a6a45", "#c8a47a", "#b08258", "#d6c0a0", "#9a6a45", "#c8a47a", "#a97b55", "#cdb48f"];
              sphere(cells, 11, 0, 0, (x, y) => {
                if ((y === 6 && (x === 7 || x === 8)) || (y === 7 && x === 8)) return "#b4573f";   // красное пятно
                return bands[Math.min(10, y + (((x * 3 + y * 5) % 7 === 0) ? 1 : 0))];
              });
            } },
          { n: "сатурн", w: 19, h: 11, fill: cells => {
              const bands = ["#dccb9c", "#c7ad76", "#d6c08c", "#bfa468", "#d3bd8a", "#c4aa72", "#dccb9c", "#c7ad76", "#d3bd8a"];
              sphere(cells, 9, 5, 1, (x, y) => bands[y]);
              for (let y = 0; y < 11; y++) for (let x = 0; x < 19; x++) {      // кольцо: задняя часть скрыта за шаром
                const dx = x - 9, dy = y - 5;
                const o = (dx / 9.4) ** 2 + (dy / 2.6) ** 2, i = (dx / 6.2) ** 2 + (dy / 1.5) ** 2;
                if (o > 1 || i <= 1) continue;
                if (dy < 0 && inDisc(9, x - 5, y - 1)) continue;
                cells.push([x, y, o > .62 ? "#c9b88e" : "#a8956b"]);
              }
            } },
          { n: "уран", w: 9, h: 9, fill: banded(9,
              ["#a8d6d8", "#98cacd", "#8fc4c8", "#98cacd", "#a8d6d8", "#98cacd", "#8fc4c8", "#7fb6bd", "#8fc4c8"]) },
          { n: "нептун", w: 9, h: 9, fill: banded(9,
              ["#5f80cc", "#4f6fb8", "#4d6cb8", "#5b7bc6", "#4a68b2", "#4f6fb8", "#3f5aa0", "#4a68b2", "#4f6fb8"],
              { "2,2": "#9db4e6", "3,2": "#9db4e6", "5,4": "#2f4182", "6,4": "#2f4182" }) }
        ];
        for (const d of PLANET_DEFS) {                          // собираем клетки, убираем повторы, группируем по цвету
          const cells = [], byPos = new Map(), byColor = new Map();
          d.fill(cells);
          for (const [x, y, col] of cells) byPos.set(y * 100 + x, [x, y, col]);   // поздние клетки (кольцо) перекрывают ранние
          for (const [x, y, col] of byPos.values()) {
            if (!byColor.has(col)) byColor.set(col, []);
            byColor.get(col).push(x, y);
          }
          d.groups = [...byColor];
          /* лёгкая «атмосфера»: клетки вплотную вокруг силуэта (4 соседа), цвет — самый частый цвет планеты */
          const halo = new Set();
          for (const [x, y] of byPos.values()) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = x + dx, ny = y + dy;
            if (!byPos.has(ny * 100 + nx)) halo.add((ny + 5) * 1000 + (nx + 5));   // сдвиг на 5, чтобы не было отрицательных чисел
          }
          d.halo = [...halo].map(k => [(k % 1000) - 5, Math.floor(k / 1000) - 5]);
          d.haloColor = d.groups.reduce((m, g) => g[1].length > m[1].length ? g : m)[0];
        }
        const planets = [];
        const debris = [];                                          // пиксели разрушенных планет, летящие в чёрную дыру
        let nextPlanet = 0, nextComet = 0;
        const maxPlanets = () => (W < 600 ? 2 : 3);
        const maxComets = () => (W < 600 ? 2 : 3);

        const rectGap = (a, b) => Math.hypot(
          Math.max(0, a.x0 - b.x1, b.x0 - a.x1),
          Math.max(0, a.y0 - b.y1, b.y0 - a.y1));
        const skyRect = q => ({ x0: q.x - 14, y0: q.y, x1: q.x + q.pw + 14, y1: q.y + q.ph + 14 });   // с подписью и покачиванием
        const planetRect = q => ({ x0: q.x - q.amp, y0: q.y, x1: q.x + q.pw + q.amp, y1: q.y + q.ph + 12 });   // с подписью

        function spawnPlanet(anywhere) {
          const used = new Set(planets.map(q => q.d));
          const free = PLANET_DEFS.filter(d => !used.has(d));
          if (!free.length) return null;
          const d = free[(Math.random() * free.length) | 0];
          const pw = d.w * CELL, ph = d.h * CELL, m = Math.min(32, W * .06);
          for (let t = 0; t < 60; t++) {                       // ищем место подальше от всех
            const q = {
              d, pw, ph, amp: rnd(2, 5), f: rnd(.1, .25), p: rnd(0, 6.28),
              x: rnd(m, Math.max(m, W - pw - m)),
              y: anywhere ? rnd(H * .08, Math.max(H * .1, H * .85 - ph)) : H,
              v: 12                                            // у всех планет одна скорость: расстояния между ними не меняются
            };
            const r = planetRect(q);
            const okSky = sky.every(s => rectGap(r, skyRect(s)) > 130);
            const okPl = planets.every(o => rectGap(r, planetRect(o)) > 110);
            const okH = holes.every(o => rectGap(r, planetRect(o)) > 110);
            if (okSky && okPl && okH) return q;
          }
          return null;
        }

        /* чёрная дыра притягивает планету (медленнее, чем звёзды). Когда планета подходит близко, она рассыпается по пикселям:
           клетки отрываются начиная с ближайших к дыре и по спирали улетают в неё */
        function startCrumble(q, w) {
          const cells = [];
          for (const [col, xy] of q.d.groups) for (let i = 0; i < xy.length; i += 2) {
            if (q.gone && q.gone.has(xy[i + 1] * 100 + xy[i])) continue;           // клетки, уже отбитые кометой
            const cx = q.x + (xy[i] + .5) * CELL, cy = q.y + (xy[i + 1] + .5) * CELL;
            cells.push({ x: xy[i], y: xy[i + 1], col, k: Math.hypot(w.x - cx, w.y - cy) + rnd(0, CELL * 2.5) });
          }
          cells.sort((a, b) => a.k - b.k);
          q.crumble = { cells, rel: 0, acc: 0, total: cells.length, rate: cells.length / 2.4 };
          q.gone = q.gone || new Set();
        }
        /* удар кометы: клетки вокруг точки удара отрываются и разлетаются от неё, остальная планета остаётся целой (с выбоиной) */
        function hitPlanet(pl, c, t) {
          pl.gone = pl.gone || new Set();
          const ox = pl.x + Math.sin(t * pl.f + pl.p) * pl.amp, rI = Math.max(2.4, Math.min(pl.d.w, pl.d.h) * .24) * CELL * rnd(.9, 1.2);
          for (const [col, xy] of pl.d.groups) for (let i = 0; i < xy.length; i += 2) {
            const key = xy[i + 1] * 100 + xy[i];
            if (pl.gone.has(key)) continue;
            const cx = ox + (xy[i] + .5) * CELL, cy = pl.y + (xy[i + 1] + .5) * CELL, dd = Math.hypot(cx - c.x, cy - c.y);
            if (dd >= rI) continue;
            pl.gone.add(key);
            const k = rnd(40, 110) / (dd || 1);
            debris.push({ x: cx, y: cy, vx: (cx - c.x) * k + c.pvx * .15, vy: (cy - c.y) * k + c.pvy * .15, col, fade: 0, scatter: true });
          }
        }
        function drawPlanet(q, t, dt) {
          q.y -= q.v * dt;
          if (q.y + q.ph + 12 < 0) return true;
          for (const w of wells) {
            const wx = w.x - (q.x + q.pw / 2), wy = w.y - (q.y + q.ph / 2), wd = Math.hypot(wx, wy) || 1;
            if (wd > w.R * 1.4) continue;
            const u = 1 - wd / (w.R * 1.4), sp = (4 + 100 * u * u) * w.k * dt;
            q.x += wx / wd * sp; q.y += wy / wd * sp;
            if (!q.crumble && wd < w.R * .75) startCrumble(q, w);
          }
          const cr = q.crumble;
          if (cr) {
            cr.acc += cr.rate * dt;
            while (cr.acc >= 1 && cr.rel < cr.total) {
              cr.acc -= 1;
              const c = cr.cells[cr.rel++];
              q.gone.add(c.y * 100 + c.x);
              debris.push({ x: q.x + Math.sin(t * q.f + q.p) * q.amp + (c.x + .5) * CELL, y: q.y + (c.y + .5) * CELL, vx: rnd(-8, 8), vy: -q.v, col: c.col, fade: 0 });
            }
            if (cr.rel >= cr.total) return true;               // планета разрушена целиком
          }
          const frac = cr ? 1 - cr.rel / cr.total : 1;
          const gone = q.gone || null;
          const edge = Math.min(H * .2, 120);
          const a = clamp01((H - q.y) / edge) * clamp01((q.y + q.ph + 12) / edge);
          if (a <= .01) return false;
          const ox = Math.round((q.x + Math.sin(t * q.f + q.p) * q.amp) * D), oy = Math.round(q.y * D);
          const cs = Math.round(CELL * D);
          /* планета лежит выше звёзд и созвездий: под силуэтом стираем то, что нарисовано раньше */
          ctx.globalCompositeOperation = "destination-out";
          ctx.fillStyle = "#000";
          ctx.globalAlpha = a;
          for (const [, xy] of q.d.groups) for (let i = 0; i < xy.length; i += 2) {
            if (gone && gone.has(xy[i + 1] * 100 + xy[i])) continue;
            ctx.fillRect(ox + xy[i] * cs, oy + xy[i + 1] * cs, cs, cs);
          }
          ctx.globalCompositeOperation = "source-over";
          /* лёгкая анимация: атмосфера «дышит» (слабый ореол в одну клетку вокруг силуэта) */
          ctx.globalAlpha = a * frac * (.11 + .08 * Math.sin(t * .8 + q.p));
          ctx.fillStyle = q.d.haloColor;
          for (const [hx, hy] of q.d.halo) ctx.fillRect(ox + hx * cs, oy + hy * cs, cs, cs);
          ctx.globalAlpha = a * .55;
          for (const [col, xy] of q.d.groups) {
            ctx.fillStyle = col;
            for (let i = 0; i < xy.length; i += 2) {
              if (gone && gone.has(xy[i + 1] * 100 + xy[i])) continue;
              ctx.fillRect(ox + xy[i] * cs, oy + xy[i + 1] * cs, cs, cs);
            }
          }
          /* и по поверхности медленно проходит светлая полоска: словно планета вращается и ловит свет */
          const sweep = ((t * 1.5 + q.p * 3) % (q.d.w + 8)) - 4;
          ctx.fillStyle = "#fff";
          for (const [, xy] of q.d.groups) {
            for (let i = 0; i < xy.length; i += 2) {
              const k = 1 - Math.abs(xy[i] + .5 - sweep) / 1.6;
              if (k <= 0 || (gone && gone.has(xy[i + 1] * 100 + xy[i]))) continue;
              ctx.globalAlpha = a * .3 * k;
              ctx.fillRect(ox + xy[i] * cs, oy + xy[i + 1] * cs, cs, cs);
            }
          }
          /* название: впритык под планетой, того же размера и вида, что у созвездий */
          ctx.fillStyle = color;
          ctx.globalAlpha = a * .5 * frac;
          ctx.font = labelFont();
          ctx.textBaseline = "top";
          ctx.fillText(q.d.n, ox, oy + Math.round((q.ph + 3) * D));
          return false;
        }

        /* обломки планет: летят к ближайшей дыре по спирали, ускоряясь; у самой тени исчезают (дыра нарисована поверх) */
        function drawDebris(dt) {
          const cs = Math.max(1, Math.round(CELL * D));
          for (let i = debris.length - 1; i >= 0; i--) {
            const p = debris[i];
            if (p.scatter) {                                       // осколки удара: разлетаются, тормозят и гаснут
              p.fade += dt;
              if (p.fade > 1.1) { debris.splice(i, 1); continue; }
              const damp = Math.exp(-dt * 2.2);
              p.vx *= damp; p.vy *= damp;
              p.x += p.vx * dt; p.y += p.vy * dt;
              ctx.globalAlpha = .55 * (1 - p.fade / 1.1);
              ctx.fillStyle = p.col;
              ctx.fillRect(Math.round(p.x * D - cs / 2), Math.round(p.y * D - cs / 2), cs, cs);
              continue;
            }
            let best = null, bd = Infinity;
            for (const w of wells) { const dd = Math.hypot(w.x - p.x, w.y - p.y); if (dd < bd) { bd = dd; best = w; } }
            let sf = 1, al = .55;
            if (best) {
              /* движение по спирали задаётся напрямую (радиус и угол вокруг дыры), а не силами: радиус только уменьшается,
                 поэтому каждый обломок гарантированно падает в дыру, а не улетает по касательной. Чем ближе, тем быстрее и круче закручивается */
              let r = Math.hypot(p.x - best.x, p.y - best.y) || 1, ang = Math.atan2(p.y - best.y, p.x - best.x);
              const u = clamp01(1 - r / (best.R * 1.3));
              r -= (25 + 900 * u * u) * best.k * dt;
              ang += Math.min(10, 110 / Math.max(r, 12)) * dt;
              if (r < best.rc * .7) { debris.splice(i, 1); continue; }
              p.x = best.x + Math.cos(ang) * r;
              p.y = best.y + Math.sin(ang) * r;
              sf = clamp01((r - best.rc * .6) / (best.rc * 1.2 + 10));
              ctx.globalAlpha = al;
              ctx.fillStyle = p.col;
              const s0 = Math.max(1, Math.round(cs * (.4 + .6 * sf)));
              ctx.fillRect(Math.round(p.x * D - s0 / 2), Math.round(p.y * D - s0 / 2), s0, s0);
              continue;
            } else {                                              // дыры больше нет рядом: обломки просто гаснут
              p.fade += dt;
              if (p.fade > .6) { debris.splice(i, 1); continue; }
              al *= 1 - p.fade / .6;
            }
            p.x += p.vx * dt; p.y += p.vy * dt;
            const s = Math.max(1, Math.round(cs * (.4 + .6 * sf)));
            ctx.globalAlpha = al;
            ctx.fillStyle = p.col;
            ctx.fillRect(Math.round(p.x * D - s / 2), Math.round(p.y * D - s / 2), s, s);
          }
        }


        /* общие помощники для звёзд и чёрных дыр: смешение цветов и css-цвет с прозрачностью */
        const mixC = (a, b, k) => [a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k, a[2] + (b[2] - a[2]) * k];
        const rgba = (c, a) => `rgba(${Math.round(c[0])},${Math.round(c[1])},${Math.round(c[2])},${Math.max(0, Math.min(1, a))})`;

        /* Гравитационная линза: всё, что уже нарисовано вокруг дыры (пиксели, кометы, созвездия, звёзды, планеты), перерисовывается
           кольцами с плавно меняющимся увеличением и лёгким закручиванием: чем ближе к дыре, тем сильнее изображение растянуто
           наружу и повёрнуто. Вдали от дыры (на краю круга) искажения нет, поэтому шва не видно. Размеры в пикселях canvas. */
        const lensCv = document.createElement("canvas"), lensCtx = lensCv.getContext("2d");
        function lensWarp(cx, cy, Rl, rIn, k) {
          const x0 = Math.max(0, Math.floor(cx - Rl)), y0 = Math.max(0, Math.floor(cy - Rl));
          const x1 = Math.min(cv.width, Math.ceil(cx + Rl)), y1 = Math.min(cv.height, Math.ceil(cy + Rl));
          const w = x1 - x0, hh = y1 - y0;
          if (w < 8 || hh < 8 || k <= .02) return;
          if (lensCv.width < w) lensCv.width = w;
          if (lensCv.height < hh) lensCv.height = hh;
          lensCtx.clearRect(0, 0, lensCv.width, lensCv.height);
          lensCtx.drawImage(cv, x0, y0, w, hh, 0, 0, w, hh);                // снимок области вокруг дыры
          const n = 20, ox = cx - x0, oy = cy - y0;
          ctx.save();
          ctx.globalAlpha = 1;
          ctx.globalCompositeOperation = "source-over";
          ctx.imageSmoothingEnabled = false;                                   // пиксельная графика остаётся чёткой
          for (let i = 0; i < n; i++) {
            const ro = Rl * (1 - i / n), ri = Rl * (1 - (i + 1) / n), rm = (ro + ri) / 2;
            if (ro < rIn) break;                                               // дальше только тень дыры
            const u = rm / Rl, f = Math.pow(1 - u, 2.2);
            const s = 1 - .42 * k * f;                                         // <1: изображение увеличено и выдвинуто наружу
            const th = .5 * k * f;                                             // поворот: пространство слегка закручено
            ctx.save();
            ctx.beginPath();
            ctx.arc(cx, cy, ro, 0, 6.2832);
            ctx.arc(cx, cy, Math.max(0, ri), 0, 6.2832, true);
            ctx.clip();
            ctx.clearRect(cx - ro - 1, cy - ro - 1, ro * 2 + 2, ro * 2 + 2);   // убираем неискажённое, вместо него — искажённое
            ctx.translate(cx, cy);
            ctx.rotate(-th);
            ctx.drawImage(lensCv, ox - ro * s, oy - ro * s, ro * 2 * s, ro * 2 * s, -ro, -ro, ro * 2, ro * 2);
            ctx.restore();
          }
          ctx.restore();
        }

        /* ---------- Чёрные дыры ----------
           Пять настоящих чёрных дыр: Стрелец A*, M87*, Лебедь X-1, TON 618 и Gaia BH1.
           Спрайт собран из клеток: чёрная тень, тонкое фотонное кольцо, наклонный аккреционный диск, дуга света над тенью
           и мягкий ореол. Диск вращается (быстрее у центра), одна сторона ярче. У каждой дыры всего три цвета из гаммы сайта
           (светлый, золотисто-янтарный, красно-бурый), яркость только двух ступеней: так они остаются спокойным фоном.
           У M87* и Лебедя X-1 есть джеты. Геометрия клеток считается один раз при появлении, в кадре остаётся только вращение.
           Плывут вверх медленнее планет, появляются у нижней границы экрана; одновременно не больше одной. */
        const HOLE_DEFS = [
          { n: "стрелец a*", N: 19, b: .34, k: 1,   pal: [[250,214,120],[232,160,50],[170,66,50]] },
          { n: "m87*",       N: 25, b: .4,  k: 1,   jets: true, pal: [[246,226,170],[226,170,70],[160,84,56]] },
          { n: "лебедь x-1", N: 15, b: .3,  k: 1,   jets: true, pal: [[240,232,200],[200,170,100],[120,100,86]] },
          { n: "ton 618",    N: 29, b: .36, k: 1,   pal: [[246,196,80],[222,112,48],[150,50,48]] },
          { n: "gaia bh1",   N: 13, b: .42, k: .75, pal: [[200,188,150],[150,130,90],[96,88,76]] }
        ];
        for (const d of HOLE_DEFS) {
          d.css = d.pal.map(c => `rgb(${c[0]},${c[1]},${c[2]})`);
          d.rs = d.N * .16;                                       // радиус тени, клеток
          d.rin = d.rs * 1.7;                                     // внутренний край диска
          d.rout = d.N / 2 - .3;                                  // внешний край диска
        }
        const holes = [];
        const wells = [];                                         // «колодцы» тяготения чёрных дыр на текущий кадр (координаты центра в css px)
        let nextHole = 0;
        const maxHoles = () => 1;                               // на сайте не больше одной чёрной дыры

        /* разбор клеток спрайта: тип 0 — передняя часть диска, 1 — тень, 2 — кольцо, 3 — задняя часть диска, 4 — дуга сверху, 5 — дуга снизу */
        function buildHole(q) {
          const d = q.d, N = d.N, cr = Math.cos(q.rot), sr = Math.sin(q.rot), cells = [];
          const { rs, rin, rout, b } = d;
          for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
            const dx = x + .5 - N / 2, dy = y + .5 - N / 2, r = Math.hypot(dx, dy);
            if (r > N / 2) continue;
            const u = dx * cr + dy * sr, v = -dx * sr + dy * cr, rho = Math.hypot(u, v / b);
            const inDisc = rho >= rin && rho <= rout;
            let t = -1, ci = 0, f = 1;
            if (inDisc && v > 0) t = 0;
            else if (r < rs) t = 1;
            else if (r < rs + 1.1) t = 2;
            else if (inDisc) t = 3;
            else if (v <= 0 && r < rs * 1.55 + 1.2) { f = 1 - (r - rs - 1.1) / (rs * .55 + .1); if (f > 0) { t = 4; ci = 1; } }
            else if (v > 0 && r < rs + 2.2) { t = 5; ci = 1; }
            if (t < 0) continue;
            let om = 0, dopf = 1, phi = 0;
            if (t === 0 || t === 3) {
              const temp = (rho - rin) / (rout - rin);
              ci = temp < .34 ? 0 : temp < .68 ? 1 : 2;
              phi = Math.atan2(v / b, u);
              om = q.spin * 3.2 * Math.pow(rin / rho, 1.5);
              dopf = 1 - .45 * q.dop * u / rho;
            }
            cells.push({ x, y, t, ci, f, om, dopf, phi, rho });
          }
          return cells;
        }

        function spawnHole(anywhere) {
          const used = new Set(holes.map(q => q.d));
          const free = HOLE_DEFS.filter(d => !used.has(d));
          if (!free.length) return null;
          const d = free[(Math.random() * free.length) | 0];
          const pw = d.N * CELL, ph = d.N * CELL, m = Math.min(48, W * .07);
          for (let t = 0; t < 60; t++) {
            const q = {
              d, pw, ph, amp: rnd(1, 3), f: rnd(.08, .2), p: rnd(0, 6.28),
              x: rnd(m, Math.max(m, W - pw - m)),
              y: anywhere ? rnd(H * .1, Math.max(H * .12, H * .8 - ph)) : H,    // появляется у нижней границы экрана
              v: 8,                                               // медленнее планет (12) и созвездий
              rot: rnd(-.4, .4), dop: Math.random() < .5 ? 1 : -1, spin: Math.random() < .5 ? 1 : -1
            };
            const r = planetRect(q);
            if (!sky.every(s => rectGap(r, skyRect(s)) > 140)) continue;
            if (!planets.every(o => rectGap(r, planetRect(o)) > 110)) continue;
            if (!holes.every(o => rectGap(r, planetRect(o)) > 220)) continue;
            if (!stars.every(o => Math.hypot(o.x - (q.x + pw / 2), o.y - (q.y + ph / 2)) > 170 + pw / 2)) continue;
            q.cells = buildHole(q);
            return q;
          }
          return null;
        }

        function drawHole(q, t, dt) {
          q.y -= q.v * dt;
          if (q.y + q.ph + 14 < 0) return true;
          const d = q.d, N = d.N;
          const edge = Math.min(H * .2, 120);
          const fade = clamp01((H - q.y) / edge) * clamp01((q.y + q.ph + 14) / edge);
          if (fade <= .01) return false;
          const cs = Math.round(CELL * D);
          const ox = Math.round((q.x + Math.sin(t * q.f + q.p) * q.amp) * D), oy = Math.round(q.y * D);
          const cx = ox + N * cs / 2, cy = oy + N * cs / 2;
          const dark = root.dataset.theme === "dark";
          const K = fade * .8;                                    // общая приглушённость: чёрные дыры не должны перетягивать внимание
          lensWarp(cx, cy, (70 + q.pw * .9) * 1.4 * D, d.rs * cs * .9, fade);
          ctx.save();
          /* дыра лежит выше всего остального: под её силуэтом стираем то, что нарисовано раньше (планеты, звёзды, созвездия) */
          ctx.globalCompositeOperation = "destination-out";
          ctx.fillStyle = "#000";
          ctx.globalAlpha = Math.min(1, fade * 1.2);
          for (const c of q.cells) ctx.fillRect(ox + c.x * cs, oy + c.y * cs, cs, cs);
          ctx.globalCompositeOperation = "source-over";

          /* ореол: очень мягкий, слабо пульсирует */
          const gr = N * cs * .9;
          const ga = K * .1 * d.k * (1 + .25 * Math.sin(t * 1.1 + q.p));
          const g = ctx.createRadialGradient(cx, cy, d.rs * cs, cx, cy, gr);
          g.addColorStop(0, rgba(d.pal[1], ga));
          g.addColorStop(1, rgba(d.pal[1], 0));
          ctx.globalAlpha = 1;
          ctx.fillStyle = g;
          ctx.fillRect(cx - gr, cy - gr, gr * 2, gr * 2);


          /* джеты: тонкие пульсирующие струи вдоль оси диска, один цвет */
          if (d.jets) {
            const ax = -Math.sin(q.rot), ay = Math.cos(q.rot), jl = Math.round(N * 1);
            ctx.fillStyle = d.css[1];
            for (const side of [-1, 1]) {
              for (let k = Math.round(d.rs) + 1; k < jl; k++) {
                const al = K * Math.pow(1 - k / jl, 1.3) * (.18 + .3 * Math.max(0, Math.sin(k * .8 - t * 4 * side)));
                if (al < .03) continue;
                ctx.globalAlpha = al;
                ctx.fillRect(Math.round(cx + side * ax * k * cs - cs / 2), Math.round(cy + side * ay * k * cs - cs / 2), cs, cs);
              }
            }
          }

          /* клетки спрайта; те, что вне экрана, пропускаем */
          const ch = cv.height;
          let last = null;
          for (const c of q.cells) {
            const py = oy + c.y * cs;
            if (py + cs < 0 || py > ch) continue;
            let col, al;
            if (c.t === 0 || c.t === 3) {
              const lit = Math.sin(c.phi * 3 + t * c.om + c.rho * .7) * c.dopf > (c.t === 0 ? .1 : .3);   // две ступени яркости
              col = d.css[c.ci];
              al = (c.t === 0 ? (lit ? .62 : .36) : (lit ? .42 : .22)) * d.k;
            } else if (c.t === 1) {
              col = dark ? "#020202" : "#050505"; al = 1;       // тень горизонта
            } else if (c.t === 2) {
              col = d.css[0]; al = (.5 + .15 * Math.sin(t * 2 + c.phi + q.p)) * d.k;   // фотонное кольцо
            } else {
              col = d.css[1]; al = (c.f > .5 ? .38 : .2) * d.k;  // дуги линзирования
            }
            if (col !== last) { ctx.fillStyle = col; last = col; }
            ctx.globalAlpha = al * (c.t === 1 ? fade : K);
            ctx.fillRect(ox + c.x * cs, py, cs, cs);
          }

          /* название под чёрной дырой: тот же размер и вид, что у планет и созвездий */
          ctx.fillStyle = color;
          ctx.globalAlpha = fade * .5;
          ctx.font = labelFont();
          ctx.textBaseline = "top";
          ctx.fillText(d.n, ox, oy + Math.round((q.ph + 3) * D));
          ctx.restore();
          return false;
        }

        /* ---------- Звёзды ----------
           Звёзды очень медленно плывут вверх. Загораются прямо на экране (не прилетают), у каждой свой размер и цвет
           (жёлтые, оранжевые, красные оттенки), вокруг мягкое пульсирующее свечение и лучи.
           Живут 10–30 секунд, перед концом немного уменьшаются, краснеют и взрываются: вспышка, кольцо и разлетающиеся пиксели.
           Одновременно их немного (до 3, на телефоне 2), и появляются они очень далеко друг от друга, от планет и созвездий. */
        const STAR_COLORS = [[247,206,74],[242,190,52],[236,160,44],[228,128,48],[222,96,52],[212,70,58],[190,52,52],[250,226,150]];
        const STAR_RED = [196,54,50], STAR_HOT = [255,244,214];
        const stars = [];
        let nextStar = 0;
        const maxStars = () => (W < 600 ? 2 : 3);

        function spawnStar() {
          const m = Math.min(56, W * .08);
          const minD = Math.min(380, Math.max(170, Math.min(W, H) * .5));
          for (let t = 0; t < 60; t++) {                       // ищем место подальше от других звёзд, планет и созвездий
            const x = rnd(m, W - m), y = rnd(120, Math.max(140, H - 70));
            if (!stars.every(o => Math.hypot(o.x - x, o.y - y) > minD)) continue;
            const r = { x0: x - 30, y0: y - 30, x1: x + 30, y1: y + 30 };
            if (!sky.every(s => rectGap(r, skyRect(s)) > 50)) continue;
            if (!planets.every(o => rectGap(r, planetRect(o)) > 50)) continue;
            if (!holes.every(o => rectGap(r, planetRect(o)) > 70)) continue;
            const n = [3, 3, 5, 5][(Math.random() * 4) | 0];
            return {
              x, y, vx: rnd(-.5, .5), vy: -rnd(3, 6),                  // очень медленно плывёт вверх, медленнее планет
              n, cs: Math.random() < .7 ? 2 : 3,                      // размер ядра: n клеток по cs px
              col: STAR_COLORS[(Math.random() * STAR_COLORS.length) | 0],
              L: rnd(10, 30), age: 0, p: rnd(0, 6.28), f: rnd(.8, 1.6), g: rnd(4, 6),
              arms: n >= 5 || Math.random() < .6, seed: rnd(0, 100), parts: null
            };
          }
          return null;
        }

        function drawStar(q, dt, t) {
          q.age += dt; q.x += q.vx * dt; q.y += q.vy * dt;
          if (q.y < -40) return true;
          /* звезда рядом с чёрной дырой тоже притягивается; долетев до тени, взрывается (раньше срока) */
          if (q.age < q.L) {
            for (const w of wells) {
              const wx = w.x - q.x, wy = w.y - q.y, wd = Math.hypot(wx, wy) || 1;
              if (wd > w.R * 1.4) continue;
              const u = 1 - wd / (w.R * 1.4), sp = (8 + 320 * u * u) * w.k * dt * .7;
              q.x += wx / wd * sp; q.y += wy / wd * sp;
              if (q.age > 1 && wd < w.rc + 8) { q.L = q.age; q.vx = q.vy = 0; break; }
            }
          }
          const a = q.age, L = q.L, SH = 2.6, EX = 1.8;
          if (a >= L + EX) return true;
          const dark = root.dataset.theme === "dark";
          const rCore = q.n * q.cs / 2, gl = rCore * q.g + 8;      // радиус ядра и свечения, css px
          const cx = Math.round(q.x * D), cy = Math.round(q.y * D);
          const cs = Math.max(1, Math.round(q.cs * D));
          let col = q.col, scale = 1, inten = 1, e = 0;
          const boom = a >= L;

          if (boom) {
            e = (a - L) / EX;
            if (!q.parts) {                                          // осколки создаются один раз в момент взрыва
              q.parts = [];
              const cnt = 16 + q.n * 3;
              for (let i = 0; i < cnt; i++) q.parts.push({ ang: rnd(0, 6.283), sp: rnd(.5, 1.5) * gl * 1.25, sz: rnd(1.5, 3.5), tone: Math.random() });
            }
          } else if (a < 2.2) {                                      // розжиг: набирает яркость и размер, мерцает
            const u = a / 2.2, ease = 1 - Math.pow(1 - u, 3);
            scale = .35 + .65 * ease;
            inten = ease * (.6 + .4 * Math.abs(Math.sin(a * 16 + q.seed)));
          } else {
            inten = .86 + .14 * Math.sin(t * q.f * 2 + q.p);         // спокойное дыхание
            if (a > L - SH) {                                         // конец жизни: уменьшается, краснеет, нервно мерцает
              const u = (a - (L - SH)) / SH, eu = u * u * (3 - 2 * u);
              scale = 1 - .38 * eu;
              inten *= (1 + .5 * eu) * (.85 + .15 * Math.sin(t * 14));
              col = mixC(q.col, STAR_RED, eu * .7);
            }
          }

          ctx.save();
          ctx.globalCompositeOperation = dark ? "lighter" : "source-over";
          const glow = (rad, al, c) => {
            const R = Math.max(1, rad * D);
            const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
            g.addColorStop(0, rgba(c, al));
            g.addColorStop(.25, rgba(c, al * .5));
            g.addColorStop(.6, rgba(c, al * .14));
            g.addColorStop(1, rgba(c, 0));
            ctx.globalAlpha = 1;
            ctx.fillStyle = g;
            ctx.fillRect(cx - R, cy - R, R * 2, R * 2);
          };
          const core = (nCells, c, al) => {                          // круглое ядро из квадратных клеток
            const w = nCells * cs, x0 = cx - Math.floor(w / 2), y0 = cy - Math.floor(w / 2);
            const comp = ctx.globalCompositeOperation;
            ctx.globalCompositeOperation = "destination-out";        // ядро звезды перекрывает созвездия под ним
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#000";
            for (let y = 0; y < nCells; y++) for (let x = 0; x < nCells; x++) if (inDisc(nCells, x, y)) ctx.fillRect(x0 + x * cs, y0 + y * cs, cs, cs);
            ctx.globalCompositeOperation = comp;
            ctx.globalAlpha = Math.max(0, Math.min(1, al));
            ctx.fillStyle = rgba(c, 1);
            for (let y = 0; y < nCells; y++) for (let x = 0; x < nCells; x++) if (inDisc(nCells, x, y)) ctx.fillRect(x0 + x * cs, y0 + y * cs, cs, cs);
          };

          if (!boom) {
            const breathe = 1 + .1 * Math.sin(t * q.f * 3 + q.p);
            glow(gl * scale * breathe, .5 * inten, col);
            glow(gl * scale * .45, .55 * inten, mixC(col, STAR_HOT, .35));
            if (q.arms) {                                            // лучи из пикселей, угасают к краям
              const len = gl * .9 * scale * (.8 + .2 * Math.sin(t * q.f * 2.4 + q.p)), step = cs;
              const rc = Math.round(rCore * scale * D);
              ctx.fillStyle = rgba(mixC(col, STAR_HOT, .5), 1);
              for (let d = rc + step; d < len * D; d += step) {
                const al = .55 * inten * Math.pow(1 - d / (len * D), 1.6);
                ctx.globalAlpha = Math.max(0, al);
                const o = Math.round(d), s0 = Math.floor(cs / 2);
                ctx.fillRect(cx + o, cy - s0, step, cs); ctx.fillRect(cx - o - step, cy - s0, step, cs);
                ctx.fillRect(cx - s0, cy + o, cs, step); ctx.fillRect(cx - s0, cy - o - step, cs, step);
              }
            }
            let nc = Math.max(1, Math.round(q.n * scale)); if (nc % 2 === 0) nc += 1;
            core(nc, col, Math.min(1, .55 + .45 * inten));
            if (nc >= 3) core(nc - 2, mixC(col, STAR_HOT, .65), Math.min(1, .6 + .4 * inten));
          } else {
            const ease = 1 - Math.pow(1 - e, 2.2);
            const flash = Math.max(0, 1 - e / .16);                  // короткая яркая вспышка
            const c0 = mixC(col, STAR_RED, .7), hot = mixC(c0, STAR_HOT, flash);
            glow(gl * (.62 + e * 3.4), .8 * Math.pow(1 - e, 1.5) + .5 * flash, hot);
            if (e < .35) {                                           // ядро вспыхивает и гаснет
              let nc = Math.max(1, Math.round(q.n * .62 * (1 + 2.2 * Math.min(1, e / .15)))); if (nc % 2 === 0) nc += 1;
              core(nc, hot, Math.max(0, 1 - e / .35));
            }
            const rr = (rCore * .6 + ease * gl * 1.5) * D, cnt = 44;   // ударное кольцо из пикселей
            ctx.fillStyle = rgba(mixC(c0, STAR_HOT, .35), 1);
            ctx.globalAlpha = .75 * Math.pow(1 - e, 1.4);
            for (let i = 0; i < cnt; i++) {
              if ((i * 7 + Math.floor(q.seed)) % 5 === 0) continue;  // кольцо рваное
              const an = i / cnt * 6.283;
              ctx.fillRect(Math.round(cx + Math.cos(an) * rr), Math.round(cy + Math.sin(an) * rr), cs, cs);
            }
            for (const pt of q.parts) {                              // разлетающиеся осколки
              const dd = pt.sp * ease * D, sz = Math.max(1, Math.round(pt.sz * (1 - e * .6) * D));
              ctx.fillStyle = rgba(pt.tone > .65 ? mixC(c0, STAR_HOT, .55) : pt.tone > .25 ? c0 : STAR_RED, 1);
              ctx.globalAlpha = Math.pow(1 - e, 1.2) * .9;
              ctx.fillRect(Math.round(cx + Math.cos(pt.ang) * dd), Math.round(cy + Math.sin(pt.ang) * dd), sz, sz);
            }
          }
          ctx.restore();
          return false;
        }

        const readColor = () => { color = getComputedStyle(root).getPropertyValue("--ink").trim() || color; };

        function resize() {
          W = innerWidth; H = innerHeight; D = Math.min(devicePixelRatio || 1, 2);
          cv.width = Math.round(W * D);
          cv.height = Math.round(H * D);
          const n = Math.max(14, Math.min(70, Math.round(W * H / 16000)));
          while (dots.length < n) dots.push(spawn(true));
          dots.length = n;
          const ns = Math.max(2, Math.min(4, Math.round(W * H / 300000) + 1));
          while (sky.length < ns) sky.push(spawnSky(true));
          sky.length = ns;
          if (!planets.length && !nextPlanet) {                 // первые планеты на экране в случайных местах
            for (let i = 0; i < (W < 600 ? 1 : 2); i++) { const q = spawnPlanet(true); if (q) planets.push(q); }
            nextPlanet = performance.now() / 1000 + rnd(4, 9);
          }
          if (!nextHole) nextHole = performance.now() / 1000 + rnd(5, 10);   // первая чёрная дыра выплывает снизу через несколько секунд
        }

        function frame(now) {
          raf = 0;
          if (isOff()) return;
          const dt = Math.min((now - last) / 1000, .05);
          last = now;
          const t = now / 1000;
          ctx.clearRect(0, 0, cv.width, cv.height);
          ctx.fillStyle = color;
          /* колодцы тяготения: центр, радиус влияния, радиус «захвата» (чуть больше тени) и заметность дыры (затухает у краёв экрана) */
          wells.length = 0;
          for (const q of holes) {
            const edge = Math.min(H * .2, 120);
            const f = clamp01((H - q.y) / edge) * clamp01((q.y + q.ph + 14) / edge);
            if (f < .4) continue;
            wells.push({ x: q.x + Math.sin(t * q.f + q.p) * q.amp + q.pw / 2, y: q.y + q.ph / 2, R: 70 + q.pw * .9, rc: q.d.rs * CELL * 1.1, k: f });
          }
          if (t >= nextStar) {                                  // новая звезда загорается на экране далеко от остальных
            if (stars.length < maxStars()) { const q = spawnStar(); if (q) stars.push(q); }
            nextStar = t + rnd(2.5, 6);
          }
          if (t >= nextPlanet) {                                // новая планета в случайный момент
            if (planets.length < maxPlanets()) { const q = spawnPlanet(false); if (q) planets.push(q); }
            nextPlanet = t + rnd(7, 18);
          }
          if (t >= nextHole) {                                  // новая чёрная дыра в случайный момент
            if (holes.length < maxHoles()) { const q = spawnHole(false); if (q) holes.push(q); }
            nextHole = t + rnd(14, 30);
          }
          if (t >= nextComet) {
            if (comets.length < maxComets()) comets.push(spawnComet());
            nextComet = t + rnd(6.5, 11);
          }
          /* слои снизу вверх: летающие пиксели, кометы, созвездия, звёзды, планеты, чёрные дыры.
             Каждый верхний слой перекрывает нижние (под силуэтом ластиком стирается всё, что нарисовано раньше) */
          for (let i = 0; i < dots.length; i++) {
            const p = dots[i];
            p.y -= p.v * dt;
            if (p.y < -10) { dots[i] = spawn(false); continue; }

            const x = p.x + Math.sin(t * p.f + p.p) * p.amp + p.ox;
            const y = p.y + p.oy;
            /* чёрные дыры притягивают пиксели по спирали (чем ближе, тем сильнее); у самой тени пиксель растворяется.
               Искривление света вокруг дыры рисует lensWarp */
            let live = 1, lx = 0, ly = 0;
            for (const w of wells) {
              const wx = w.x - x, wy = w.y - y, wd2 = wx * wx + wy * wy;
              if (wd2 > w.R * w.R) continue;
              const wd = Math.sqrt(wd2) || 1, u = 1 - wd / w.R, nx = wx / wd, ny = wy / wd;
              const sp = (30 + 420 * u * u) * w.k * dt;
              p.x += nx * sp - ny * sp * .45;
              p.y += ny * sp + nx * sp * .45;
              if (wd < w.rc && !p.dying) p.dying = .0001;
            }
            if (p.dying) {
              p.dying += dt;
              if (p.dying > .4) { dots[i] = spawn(false); continue; }
              live = 1 - p.dying / .4;
            }
            const dx = x - mx, dy = y - my, d2 = dx * dx + dy * dy;
            if (d2 < 10000 && d2 > .01) {                 // курсор отталкивает в радиусе 100px
              const d = Math.sqrt(d2), k = (100 - d) / 100 * 220 * dt;
              p.ox += dx / d * k;
              p.oy += dy / d * k;
            }
            const damp = Math.exp(-dt * 2.5);
            p.ox *= damp; p.oy *= damp;

            const tw = (Math.sin(t * p.tw + p.tp) + 1) / 2;                        // плавное мерцание
            ctx.globalAlpha = p.a * (.35 + .65 * tw) * live;
            const s = Math.max(1, Math.round(p.s * D * live));
            ctx.fillRect(Math.round((x + lx) * D), Math.round((y + ly) * D), s, s);
          }
          for (let i = comets.length - 1; i >= 0; i--) if (drawComet(comets[i], dt, t)) comets.splice(i, 1);
          ctx.globalAlpha = 1; ctx.fillStyle = color;
          for (let i = 0; i < sky.length; i++) {
            if (drawSky(sky[i], t, dt)) sky[i] = spawnSky(false);
          }
          for (let i = stars.length - 1; i >= 0; i--) if (drawStar(stars[i], dt, t)) stars.splice(i, 1);
          for (let i = planets.length - 1; i >= 0; i--) if (drawPlanet(planets[i], t, dt)) planets.splice(i, 1);
          drawDebris(dt);
          for (let i = holes.length - 1; i >= 0; i--) if (drawHole(holes[i], t, dt)) holes.splice(i, 1);
          raf = requestAnimationFrame(frame);
        }

        /* запуск / остановка при смене темы или режима анимаций */
        function sync() {
          readColor();
          if (isOff()) {
            cancelAnimationFrame(raf);
            raf = 0;
            ctx.clearRect(0, 0, cv.width, cv.height);
          } else if (!raf) {
            last = performance.now();
            raf = requestAnimationFrame(frame);
          }
        }

        addEventListener("resize", resize);
        new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-theme", "data-motion"] });
        addEventListener("pointermove", e => { mx = e.clientX; my = e.clientY; }, { passive: true });
        const away = () => { mx = my = -999; };
        document.addEventListener("pointerleave", away);
        addEventListener("pointerup", e => { if (e.pointerType !== "mouse") away(); });
        addEventListener("pointercancel", away);
        resize();
        sync();
      })();

      /* ---------- Туманности ----------
         Самый нижний слой (canvas #neb под #px). Небольшие, очень тусклые, разных цветов, одновременно не больше 3 (на телефоне 1),
         с объектами не взаимодействуют. Облако газа пересчитывается на мелкой сетке ~30 раз в секунду:
         слои шума течут в разные стороны, облако закручивается, клубы рвутся и срастаются, края расползаются —
         как будто газ распыляется. Растягивается браузером со сглаживанием, поэтому выглядит мягким дымом. */
      (() => {
        const cv = $("neb"), ctx = cv.getContext("2d");
        const rnd = (a, b) => a + Math.random() * (b - a);
        const PAL = [   // [основной, второй, светлые прожилки] — приглушённые, чтобы не пересвечивать объекты
          [[90, 60, 200], [200, 60, 140], [170, 150, 230]],    // фиолетово-розовая
          [[40, 100, 200], [40, 170, 170], [130, 180, 220]],   // сине-бирюзовая
          [[200, 70, 50],  [210, 130, 50], [220, 170, 140]],   // огненная
          [[40, 160, 110], [70, 100, 200], [130, 200, 170]],   // изумрудно-синяя
          [[180, 55, 110], [120, 55, 190], [210, 150, 190]],   // малиново-лиловая
          [[210, 150, 55], [200, 85, 75],  [225, 195, 140]]    // золотисто-красная
        ];
        const GW = 72, STEP = 1 / 30;
        let W = 0, H = 0, list = [], next = 0, raf = 0, last = 0;
        const maxNeb = () => W < 600 ? 1 : W < 1600 ? 2 : 3;   // на телефоне одна, на обычном экране две, на большом три

        function hash(x, y, s) { let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
        function vnoise(x, y, s) {
          const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
          const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
          const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
          return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
        }
        function fbm(x, y, s, oct) { let a = .5, f = 1, r = 0, n = 0; for (let i = 0; i < oct; i++) { r += a * vnoise(x * f, y * f, s + i * 17); n += a; a *= .5; f *= 2.03; } return r / n; }

        function build() {
          let i, tries = 0;   // палитра, которой нет у других живых туманностей
          do i = (Math.random() * PAL.length) | 0; while (list.some(o => o.pi === i) && ++tries < 30);
          const w = Math.round(Math.min(Math.max(rnd(.17, .26) * Math.max(W, H), 200), W * .7)), h = Math.round(w * rnd(.7, 1));
          const gh = Math.max(24, Math.round(GW * h / w));
          const off = document.createElement("canvas"); off.width = GW; off.height = gh;
          const oc = off.getContext("2d");
          const margin = .1;
          let bx = 0, by = 0, best = -1;   // из нескольких случайных мест берём самое далёкое от других туманностей
          for (let k = 0; k < 12; k++) {
            const x = rnd(-w * margin, W - w * (1 - margin)), y = rnd(-h * margin, H - h * (1 - margin));
            let dmin = 1e9;
            for (const o of list) dmin = Math.min(dmin, Math.hypot(x + w / 2 - o.x - o.w / 2, y + h / 2 - o.y - o.h / 2));
            if (dmin > best) { best = dmin; bx = x; by = y; }
          }
          return {
            off, oc, img: oc.createImageData(GW, gh), gh, w, h, pal: PAL[i], pi: i,
            seed: (Math.random() * 1e6) | 0, sc: rnd(2.0, 3.0), sx: rnd(.85, 1.25),
            rot: rnd(0, 6.28), sw: rnd(.25, .5) * (Math.random() < .5 ? -1 : 1),            // сила закручивания
            fx: rnd(.05, .11), fy: rnd(.04, .09), ph: rnd(0, 6.28),                         // скорости течения слоёв
            x: bx, y: by,
            vx: rnd(-1.4, 1.4), vy: rnd(-1.1, 1.1),
            life: rnd(55, 90), fade: rnd(8, 12), peak: rnd(.07, .11), br: rnd(0, 6.28), bf: rnd(.1, .22),
            t0: 0, acc: rnd(0, STEP)
          };
        }

        /* пересчёт газа в момент T (секунды жизни туманности) */
        function fill(q, T) {
          const gw = GW, gh = q.gh, px = q.img.data, pal = q.pal, sd = q.seed, sc = q.sc;
          const cr = Math.cos(q.rot), sr = Math.sin(q.rot);
          const sw = q.sw * Math.sin(T * .09 + q.ph);                       // закрутка то в одну, то в другую сторону
          const ax = T * q.fx, ay = T * q.fy;
          for (let y = 0; y < gh; y++) for (let x = 0; x < gw; x++) {
            const nx = (x / gw - .5) * 2, ny = (y / gh - .5) * 2;
            const r2 = nx * nx * .9 + ny * ny * 1.1, e = Math.sqrt(r2);
            const ang = sw * (1 - Math.min(1, e)) * 2;                       // чем ближе к центру, тем сильнее поворот: вихрь
            const ca = Math.cos(ang), sa = Math.sin(ang);
            const vx = nx * ca - ny * sa, vy = nx * sa + ny * ca;
            const rx = (vx * cr - vy * sr) * q.sx * sc, ry = (vx * sr + vy * cr) * sc;
            /* два слоя искажения текут в противоположные стороны: клубы то сжимаются, то расползаются */
            const q1 = fbm(rx + 5.2 + ax, ry + 1.3 - ay, sd, 3), q2 = fbm(rx - 3.7 - ax * .8, ry + 8.1 + ay * 1.2, sd + 9, 3);
            const wx = rx + (q1 - .5) * 3.8, wy = ry + (q2 - .5) * 3.8;
            let d = fbm(wx + ay * .6, wy - ax * .6, sd + 31, 4);
            const edge = e + (fbm(rx * .7 + ax * .7, ry * .7 - ay * .7, sd + 55, 3) - .5) * .7;   // край тоже плывёт
            const mask = Math.pow(Math.max(0, 1 - edge * edge), 1.25);
            d = Math.max(0, d - .4) / .6;
            d = Math.pow(d, 1.3) * mask;
            const m = fbm(wx * .8 + 20 - ax, wy * .8 - 7 + ay, sd + 77, 3);
            const hi = Math.pow(Math.max(0, d - .45) / .55, 1.5) * .35;
            const i = (y * gw + x) * 4;
            px[i]     = pal[0][0] + (pal[1][0] - pal[0][0]) * m + (pal[2][0] - pal[0][0]) * hi;
            px[i + 1] = pal[0][1] + (pal[1][1] - pal[0][1]) * m + (pal[2][1] - pal[0][1]) * hi;
            px[i + 2] = pal[0][2] + (pal[1][2] - pal[0][2]) * m + (pal[2][2] - pal[0][2]) * hi;
            px[i + 3] = Math.min(255, d * 255);
          }
          q.oc.putImageData(q.img, 0, 0);
        }

        function resize() {
          W = innerWidth; H = innerHeight;
          cv.width = W; cv.height = H;
        }

        function frame(now) {
          raf = 0;
          if (isOff()) return;
          const dt = Math.min((now - last) / 1000, .05); last = now;
          const t = now / 1000;
          ctx.clearRect(0, 0, cv.width, cv.height);
          if (list.length < maxNeb() && t >= next) {                  // новая туманность, пока не набрано максимум
            const q = build(); q.t0 = t; list.push(q);
            next = t + (list.length < maxNeb() ? rnd(10, 25) : 0);   // следующая появляется не сразу
          }
          for (let n = list.length - 1; n >= 0; n--) {
            const cur = list[n], age = t - cur.t0;
            if (age > cur.life) {
              list.splice(n, 1);
              if (next < t + 1) next = t + rnd(4, 12);
              continue;
            }
            cur.acc += dt;
            if (cur.acc >= STEP) { cur.acc = 0; fill(cur, age); }     // газ пересчитывается ~30 раз в секунду
            const e = x => x * x * (3 - 2 * x);
            const k = e(Math.min(1, age / cur.fade)) * e(Math.min(1, (cur.life - age) / cur.fade)) * cur.peak * (.8 + .2 * Math.sin(t * cur.bf + cur.br));
            cur.x += cur.vx * dt; cur.y += cur.vy * dt;
            ctx.globalAlpha = k;
            ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
            ctx.drawImage(cur.off, cur.x, cur.y, cur.w, cur.h);
          }
          ctx.globalAlpha = 1;
          raf = requestAnimationFrame(frame);
        }

        function sync() {
          if (isOff()) { cancelAnimationFrame(raf); raf = 0; cv.classList.remove("on"); ctx.clearRect(0, 0, cv.width, cv.height); list = []; }
          else { cv.classList.add("on"); if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } }
        }
        addEventListener("resize", resize);
        new MutationObserver(sync).observe(root, { attributes: true, attributeFilter: ["data-motion"] });
        resize();
        next = performance.now() / 1000 + .3;
        sync();
      })();
    })();
  </script>
  <script>
    /* экран загрузки уходит, когда готово всё: страница, стили, картинки и шрифт;
       минимум 300 мс, чтобы не мигал, и страховка 10 с, чтобы не зависнуть при сбое сети */
    (() => {
      const boot = document.getElementById("boot"), root = document.documentElement;
      if (!boot) return;
      const t0 = performance.now();
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        const wait = Math.max(0, 300 - (performance.now() - t0));
        setTimeout(() => {
          requestAnimationFrame(() => {
            root.classList.remove("booting");   // стартуют анимации появления
            boot.classList.add("hide");
            setTimeout(() => boot.remove(), 600);
          });
        }, wait);
      };
      const loaded = new Promise(r => document.readyState === "complete" ? r() : addEventListener("load", r, { once: true }));
      const fonts = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
      Promise.all([loaded, fonts]).then(finish, finish);
      setTimeout(finish, 10000);
    })();
  </script>
</body>
